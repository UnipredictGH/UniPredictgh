<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>UniPredict Ghana — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,button,a{cursor:pointer}
input,select,textarea{cursor:text}
body{background:#0f0f1a;color:#e2e8f0;min-height:100vh;font-size:14px;font-family:system-ui,-apple-system,sans-serif}
.top{background:#161625;border-bottom:2px solid #7C3AED;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-logo{font-size:16px;font-weight:900;background:linear-gradient(135deg,#7C3AED,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-right{display:flex;align-items:center;gap:12px}
.top-link{font-size:12px;color:#7C3AED;text-decoration:none;font-weight:600;border:1px solid rgba(124,58,237,.3);padding:5px 10px;border-radius:6px}
.tabs{background:#161625;border-bottom:1px solid rgba(255,255,255,.07);padding:0 12px;display:flex;overflow-x:auto;gap:1px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 13px;font-size:12px;font-weight:600;color:#64748b;white-space:nowrap;border:none;background:none;border-bottom:3px solid transparent;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
.tab.on{color:#a78bfa;border-bottom-color:#7C3AED}
.con{padding:16px;max-width:1000px;margin:0 auto;padding-bottom:80px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:#1e1e32;border-radius:10px;padding:14px 10px;text-align:center;cursor:default}
.stat-n{font-size:24px;font-weight:900;color:#f1f5f9}
.stat-l{font-size:10px;color:#64748b;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.card{background:#161625;border:1px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card-hd{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-hd h3{font-size:14px;font-weight:800;color:#f1f5f9}
.card-bd{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-g{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff}
.btn-s{background:rgba(124,58,237,.18);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.btn-r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-gr{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-o{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.btn-gh{background:transparent;color:#64748b;border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-fl{width:100%}
.inp{width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:inherit;outline:none;display:block;cursor:text}
.inp:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.inp::placeholder{color:#334155}
textarea.inp{resize:vertical;min-height:68px}
.lbl{font-size:10.5px;font-weight:700;color:#94a3b8;margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.4px}
.fg{margin-bottom:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.bdg{display:inline-flex;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.bdg-p{background:rgba(124,58,237,.2);color:#a78bfa}
.bdg-g{background:rgba(16,185,129,.15);color:#6ee7b7}
.bdg-r{background:rgba(239,68,68,.15);color:#fca5a5}
.bdg-o{background:rgba(245,158,11,.15);color:#fcd34d}
.bdg-b{background:rgba(59,130,246,.15);color:#93c5fd}
.bdg-y{background:rgba(255,255,255,.07);color:#94a3b8}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:500;padding:16px}
.ov.on{display:flex}
.md{background:#161625;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.md h3{font-size:15px;font-weight:800;color:#f1f5f9;margin-bottom:14px}
.md-x{position:absolute;top:12px;right:14px;background:none;border:none;color:#475569;font-size:22px;cursor:pointer;padding:4px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;line-height:1}
.tog{width:44px;height:24px;background:#334155;border-radius:99px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:inline-block}
.tog.on{background:#7C3AED}
.tog-d{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;pointer-events:none}
.tog.on .tog-d{left:23px}
.toasts{position:fixed;bottom:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#1e1e32;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:12px;color:#f1f5f9;display:flex;align-items:center;gap:8px;min-width:180px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.row:last-child{border-bottom:none}
.row-info h4{font-size:13px;font-weight:600;color:#f1f5f9}
.row-info p{font-size:11px;color:#475569;margin-top:2px}
.srch{position:relative;margin-bottom:12px}
.srch-inp{width:100%;padding:9px 12px 9px 34px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:inherit;outline:none}
.srch-inp:focus{border-color:#7C3AED}
.srch::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.empty{text-align:center;padding:36px;color:#475569}
.pag{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid rgba(255,255,255,.06)}
.pag-btn{padding:4px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.07);background:#1e1e32;color:#94a3b8;font-size:11px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pag-btn.on{background:#7C3AED;color:#fff;border-color:#7C3AED}
.ph2{font-size:15px;font-weight:800;color:#f1f5f9;margin-bottom:14px}
.flex-sb{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
</style>
</head>
<body ontouchstart="">
<div class="top">
  <div class="top-logo">🎓 UniPredict Admin</div>
  <div class="top-right">
    <a class="top-link" href="https://uni-predict.netlify.app" target="_blank">View Student Site ↗</a>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div class="con" id="con"></div>
<div class="toasts" id="toasts"></div>
<div class="ov" id="ov">
  <div class="md" id="md">
    <button class="md-x" id="md-x">✕</button>
    <div id="md-body"></div>
  </div>
</div>
<script>
var SU="https://urfqevstrwsrtysbllah.supabase.co";
var SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";
var CUR="dash";

function hdr(){return{“apikey”:SK,“Authorization”:“Bearer “+SK,“Content-Type”:“application/json”,“Prefer”:“return=representation”};}
function GET(t,q){return fetch(SU+”/rest/v1/”+t+”?”+(q||””)+”&limit=5000”,{headers:hdr()}).then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(x);});return r.json();});}
function POST(t,b){return fetch(SU+”/rest/v1/”+t,{method:“POST”,headers:hdr(),body:JSON.stringify(b)}).then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(x);});return r.json();});}
function PATCH(t,id,b){return fetch(SU+”/rest/v1/”+t+”?id=eq.”+id,{method:“PATCH”,headers:hdr(),body:JSON.stringify(b)}).then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(x);});return r.json();});}
function DEL(t,id){return fetch(SU+”/rest/v1/”+t+”?id=eq.”+id,{method:“DELETE”,headers:hdr()}).then(function(r){if(!r.ok)throw new Error(r.status);});}
function SSET(k,v){var h=hdr();h[“Prefer”]=“resolution=merge-duplicates”;return fetch(SU+”/rest/v1/settings”,{method:“POST”,headers:h,body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})}).then(function(r){if(!r.ok)throw new Error(“fail”);return r.text();});}

function toast(msg,type){
var icons={success:“✅”,error:“❌”,info:“ℹ️”,warn:“⚠️”};
var el=document.createElement(“div”);el.className=“toast”;
el.innerHTML=(icons[type]||“ℹ️”)+” “+msg;
document.getElementById(“toasts”).appendChild(el);
setTimeout(function(){el.style.opacity=“0”;el.style.transition=“opacity .3s”;setTimeout(function(){el.remove();},300);},3500);
}
function openMd(html){document.getElementById(“md-body”).innerHTML=html;document.getElementById(“ov”).classList.add(“on”);}
function closeMd(){document.getElementById(“ov”).classList.remove(“on”);}
document.getElementById(“md-x”).onclick=function(){closeMd();};
document.getElementById(“md-x”).addEventListener(“touchend”,function(e){e.preventDefault();closeMd();});
document.getElementById(“ov”).onclick=function(e){if(e.target===this)closeMd();};

function gv(id){var el=document.getElementById(id);return el?el.value.trim():””;}
function gs(id){var el=document.getElementById(id);return el?el.value:””;}
function ge(id){return document.getElementById(id);}
function esc(s){return(s||””).replace(/&/g,”&”).replace(/</g,”<”).replace(/”/g,”"”).replace(/’/g,”'”);}
function dateStr(d){return d?new Date(d).toLocaleDateString(“en-GB”,{day:“numeric”,month:“short”,year:“numeric”}):”—”;}
function bdg(t,c){return”<span class='bdg bdg-"+c+"'>”+t+”</span>”;}
function csv(s){return s?s.split(”,”).map(function(x){return x.trim();}).filter(Boolean):[];}

// ── TABS ──
var TABS=[
{id:“dash”,label:“📊 Dashboard”},
{id:“unis”,label:“🏛️ Universities”},
{id:“progs”,label:“📚 Programmes”},
{id:“ai”,label:“🤖 AI Inbox”},
{id:“schols”,label:“🎓 Scholarships”},
{id:“news”,label:“📰 News”},
{id:“forms”,label:“📝 Forms”},
{id:“anns”,label:“📢 Announcements”},
{id:“pays”,label:“💳 Payments”},
{id:“users”,label:“👥 Users”},
{id:“appear”,label:“🎨 Appearance”},
{id:“stext”,label:“✏️ Site Text”},
{id:“feats”,label:“🔧 Toggles”},
{id:“pstack”,label:“🔑 Paystack”}
];

function buildTabs(){
var el=ge(“tabs”);el.innerHTML=””;
TABS.forEach(function(t){
var btn=document.createElement(“button”);
btn.className=“tab”+(CUR===t.id?” on”:””);
btn.textContent=t.label;
btn.onclick=function(){show(t.id);};
btn.addEventListener(“touchend”,function(e){e.preventDefault();show(t.id);});
el.appendChild(btn);
});
}

function show(id){
CUR=id;buildTabs();
var fns={dash:showDash,unis:showUnis,progs:showProgs,ai:showAI,schols:showSchols,news:showNews,forms:showForms,anns:showAnns,pays:showPays,users:showUsers,appear:showAppear,stext:showStext,feats:showFeats,pstack:showPstack};
if(fns[id])fns[id]();
}

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
function showDash(){
ge(“con”).innerHTML=
‘<div class="stats">’
+’<div class="stat"><div class="stat-n" id="d-unis">—</div><div class="stat-l">🏛️ Universities</div></div>’
+’<div class="stat"><div class="stat-n" id="d-progs">—</div><div class="stat-l">📚 Programmes</div></div>’
+’<div class="stat"><div class="stat-n" id="d-users">—</div><div class="stat-l">👥 Users</div></div>’
+’<div class="stat"><div class="stat-n" id="d-rev">—</div><div class="stat-l">💰 Revenue GHC</div></div>’
+’<div class="stat"><div class="stat-n" id="d-pend">—</div><div class="stat-l">⏳ Pending Pays</div></div>’
+’<div class="stat"><div class="stat-n" id="d-ai">—</div><div class="stat-l">🤖 AI Questions</div></div>’
+’</div>’
+’<div class="card"><div class="card-hd"><h3>Quick Actions</h3></div><div class="card-bd" style="display:flex;gap:6px;flex-wrap:wrap">’
+’<button class="btn btn-g" onclick="show(\'unis\')">🏛️ Universities</button>’
+’<button class="btn btn-s" onclick="show(\'progs\')">📚 Programmes</button>’
+’<button class="btn btn-s" onclick="show(\'ai\')">🤖 AI Inbox</button>’
+’<button class="btn btn-s" onclick="show(\'pays\')">💳 Payments</button>’
+’<button class="btn btn-s" onclick="show(\'users\')">👥 Users</button>’
+’<button class="btn btn-s" onclick="show(\'anns\')">📢 Announcements</button>’
+’<button class="btn btn-s" onclick="show(\'appear\')">🎨 Appearance</button>’
+’<button class="btn btn-s" onclick="show(\'feats\')">🔧 Toggles</button>’
+’<button class="btn btn-s" onclick="show(\'stext\')">✏️ Edit Text</button>’
+’<button class="btn btn-s" onclick="show(\'pstack\')">🔑 Paystack</button>’
+’</div></div>’;
GET(“universities”,“select=id,active”).then(function(d){var el=ge(“d-unis”);if(el)el.textContent=(d||[]).filter(function(x){return x.active;}).length;}).catch(function(){});
GET(“programmes”,“select=id,active”).then(function(d){var el=ge(“d-progs”);if(el)el.textContent=(d||[]).filter(function(x){return x.active;}).length;}).catch(function(){});
GET(“profiles”,“select=id”).then(function(d){var el=ge(“d-users”);if(el)el.textContent=(d||[]).length;}).catch(function(){});
GET(“payments”,“status=eq.success&select=amount”).then(function(d){var el=ge(“d-rev”);if(el)el.textContent=Math.round((d||[]).reduce(function(s,x){return s+(x.amount||0);},0)/100);}).catch(function(){});
GET(“payments”,“status=eq.pending&select=id”).then(function(d){var el=ge(“d-pend”);if(el)el.textContent=(d||[]).length;}).catch(function(){});
GET(“ai_inbox”,“status=eq.pending&select=id”).then(function(d){var el=ge(“d-ai”);if(el)el.textContent=(d||[]).length;}).catch(function(){});
}

// ══════════════════════════════════════════
// UNIVERSITIES
// ══════════════════════════════════════════
var _unis=[],_pc={};
function showUnis(){
ge(“con”).innerHTML=
‘<div class="flex-sb"><h2 class="ph2">Universities</h2><button class="btn btn-g" onclick="uniForm(null)">+ Add University</button></div>’
+’<div class="srch"><input class="srch-inp" id="uni-s" placeholder="Search universities..." oninput="uniFilter(this.value)"></div>’
+’<div class="card"><table class="tbl"><thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Region</th><th>Progs</th><th>Status</th><th>Actions</th></tr></thead>’
+’<tbody id="uni-tb"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></div>’;
Promise.all([GET(“universities”,“order=name.asc&select=*”),GET(“programmes”,“select=university_id”)]).then(function(r){
_unis=r[0]||[];_pc={};
(r[1]||[]).forEach(function(p){_pc[p.university_id]=(_pc[p.university_id]||0)+1;});
_unis.forEach(function(u){u._pc=_pc[u.id]||0;});
uniRows(_unis);
}).catch(function(e){toast(“Error loading: “+e.message,“error”);});
}
function uniRows(data){
var tb=ge(“uni-tb”);if(!tb)return;
if(!data.length){tb.innerHTML=’<tr><td colspan="7" class="empty">No universities found</td></tr>’;return;}
tb.innerHTML=data.map(function(u){
return “<tr>”
+”<td>”+bdg(u.code,“p”)+”</td>”
+’<td style="font-weight:600;color:#f1f5f9">’+esc(u.name)+”</td>”
+”<td>”+bdg(u.type||”—”,u.type===“Public”?“g”:u.type===“Private”?“o”:“b”)+”</td>”
+’<td style="color:#64748b;font-size:11px">’+(u.region||”—”)+”</td>”
+’<td style="color:#64748b">’+u._pc+”</td>”
+”<td>”+bdg(u.active?“Active”:“Hidden”,u.active?“g”:“r”)+”</td>”
+’<td style="white-space:nowrap">’
+’<button class="btn btn-gh btn-sm" onclick="uniEdit(\''+u.id+'\')">Edit</button> ’
+’<button class=“btn ‘+(u.active?“btn-o”:“btn-gr”)+’ btn-sm” onclick=“uniToggle('’+u.id+’',’+(!u.active)+’)”>’+(u.active?“Hide”:“Show”)+’</button> ’
+’<button class="btn btn-r btn-sm" onclick="uniDel(\''+u.id+'\')">Del</button>’
+”</td></tr>”;
}).join(””);
}
function uniFilter(q){uniRows(q?_unis.filter(function(u){return(u.name+u.code+(u.region||””)).toLowerCase().indexOf(q.toLowerCase())>=0;}):_unis);}
function uniToggle(id,v){PATCH(“universities”,id,{active:v}).then(function(){toast(v?“Shown”:“Hidden”,“success”);showUnis();}).catch(function(){toast(“Error”,“error”);});}
function uniDel(id){if(!confirm(“Delete this university and all its data?”))return;DEL(“universities”,id).then(function(){toast(“Deleted”,“info”);showUnis();}).catch(function(){toast(“Error”,“error”);});}
function uniEdit(id){var u=_unis.find(function(x){return x.id===id;});if(u)uniForm(u);}
function uniForm(u){
var REGS=[“Greater Accra”,“Ashanti”,“Central”,“Eastern”,“Western”,“Western North”,“Volta”,“Oti”,“Northern”,“North East”,“Savannah”,“Upper East”,“Upper West”,“Bono”,“Bono East”,“Ahafo”];
var TYPES=[“Public”,“Private”,“Technical”,“Distance”];
openMd(’<h3>’+(u?“Edit”:“Add”)+’ University</h3>’
+’<div class="fg"><label class="lbl">Code (e.g. UG, KNUST)</label><input class=“inp” id=“uc” value=”’+esc(u?u.code:””)+’”></div>’
+’<div class="fg"><label class="lbl">Full Name</label><input class=“inp” id=“un” value=”’+esc(u?u.name:””)+’”></div>’
+’<div class="fg"><label class="lbl">Short Name</label><input class=“inp” id=“us” value=”’+esc(u?u.short_name||””:””)+’”></div>’
+’<div class="g2">’
+’<div class="fg"><label class="lbl">Type</label><select class="inp" id="ut">’+TYPES.map(function(t){return’<option’+(u&&u.type===t?” selected”:””)+’>’+t+’</option>’;}).join(””)+’</select></div>’
+’<div class="fg"><label class="lbl">Founded</label><input class=“inp” type=“number” id=“uf” value=”’+esc(u?u.founded||””:””)+’”></div>’
+’<div class="fg"><label class="lbl">City / Location</label><input class=“inp” id=“ul” value=”’+esc(u?u.location||””:””)+’”></div>’
+’<div class="fg"><label class="lbl">Region</label><select class="inp" id="ur">’+REGS.map(function(r){return’<option’+(u&&u.region===r?” selected”:””)+’>’+r+’</option>’;}).join(””)+’</select></div>’
+’</div>’
+’<div class="fg"><label class="lbl">Website</label><input class=“inp” id=“uw” value=”’+esc(u?u.website||””:””)+’”></div>’
+’<div class="fg"><label class="lbl">About (short description)</label><textarea class="inp" id="ua">’+esc(u&&u.about?u.about:””)+’</textarea></div>’
+’<div style="display:flex;gap:8px">’
+’<button class=“btn btn-g” onclick=“uniSave('’+esc(u?u.id:””)+”’)">Save</button>”
+’<button class="btn btn-gh" onclick="closeMd()">Cancel</button></div>’);
}
function uniSave(id){
var code=gv(“uc”).toUpperCase(),name=gv(“un”);

function progFilter(){

function showPays(){
ge(“con”).innerHTML=
‘<div class="flex-sb"><div><h2 class="ph2">Payments</h2><p id="pay-sum" style="font-size:12px;color:#475569;margin-top:-10px;margin-bottom:14px">Loading…</p></div>’

+’<tbody id="pay-tb"></tbody></table></div>’;
payLoad();
}
function payLoad(){
var st=(ge(“pay-f”)||{}).value||””;
GET(“payments”,(st?“status=eq.”+st+”&”:””)+“order=created_at.desc&select=*”).then(function(d){
var tb=ge(“pay-tb”);if(!tb)return;
var rev=(d||[]).filter(function(p){return p.status===“success”;}).reduce(function(s,p){return s+(p.amount||0);},0);
var sm=ge(“pay-sum”);if(sm)sm.textContent=(d||[]).length+” records · GHC “+Math.round(rev/100)+” total collected”;
if(!d||!d.length){tb.innerHTML=’<tr><td colspan="6" class="empty">No payments</td></tr>’;return;}
tb.innerHTML=d.map(function(p){
return “<tr>”
+’<td style="color:#64748b;font-size:11px">’+dateStr(p.created_at)+”</td>”
+’<td style="color:#f1f5f9">’+(p.user_email||p.user_id||”—”)+”</td>”
+’<td style="font-weight:700;color:#f1f5f9">GHC ‘+((p.amount||0)/100).toFixed(2)+”</td>”
+’<td>’+bdg(p.plan||”—”,“b”)+”</td>”
+”<td>”+bdg(p.status,p.status===“success”?“g”:p.status===“pending”?“o”:p.status===“refunded”?“b”:“r”)+”</td>”
+’<td style="white-space:nowrap">’
+(p.status===“pending”?’<button class="btn btn-gr btn-sm" onclick="payApprove(\''+p.id+'\')">Approve</button> ‘:””)
+(p.status===“success”?’<button class="btn btn-gh btn-sm" onclick="payRefund(\''+p.id+'\')">Refund</button>’:””)
+”</td></tr>”;
}).join(””);
}).catch(function(){});
}
function payApprove(id){PATCH(“payments”,id,{status:“success”,verified_at:new Date().toISOString()}).then(function(){toast(“Approved ✅”,“success”);payLoad();});}
function payRefund(id){if(!confirm(“Mark as refunded?”))return;PATCH(“payments”,id,{status:“refunded”}).then(function(){toast(“Refunded”,“info”);payLoad();});}

var _users=[];
function showUsers(){
ge(“con”).innerHTML=
‘<div class="flex-sb"><div><h2 class="ph2">Users</h2><p id="user-ct" style="font-size:12px;color:#475569;margin-top:-10px;margin-bottom:14px">Loading…</p></div>’
+’<input class="inp" id="user-s" placeholder="Search users..." oninput="userSearch(this.value)" style="width:200px"></div>’
+’<div class="card"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Total Paid</th><th>Checks</th><th></th></tr></thead>’
+’<tbody id="user-tb"></tbody></table></div>’;
Promise.all([GET(“profiles”,“order=created_at.desc&select=*”),GET(“payments”,“status=eq.success&select=user_id,amount,plan”)])
.then(function(r){
var pm={};
(r[1]||[]).forEach(function(x){pm[x.user_id]=(pm[x.user_id]||0)+(x.amount||0);});
_users=(r[0]||[]).map(function(x){return Object.assign({},x,{_p:pm[x.id]||0});});
var ct=ge(“user-ct”);if(ct)ct.textContent=_users.length+” registered users”;
userRows(_users);
}).catch(function(){GET(“profiles”,“select=*”).then(function(d){_users=d||[];userRows(_users);}).catch(function(){});});
}
function userSearch(q){userRows(q?_users.filter(function(u){return(u.email||u.full_name||””).toLowerCase().indexOf(q.toLowerCase())>=0;}):_users);}
function userRows(data){
var tb=ge(“user-tb”);if(!tb)return;
if(!data.length){tb.innerHTML=’<tr><td colspan="6" class="empty">No users found</td></tr>’;return;}
tb.innerHTML=data.map(function(u){
return “<tr>”
+’<td style="color:#f1f5f9;font-weight:500">’+(u.full_name||u.name||”—”)+”</td>”
+’<td style="color:#64748b;font-size:11px">’+(u.email||”—”)+”</td>”
+’<td style="color:#64748b;font-size:11px">’+dateStr(u.created_at)+”</td>”
+’<td style=“color:’+((u._p||0)>0?”#10b981”:”#475569”)+’”>GHC ‘+((u._p||0)/100).toFixed(2)+”</td>”
+’<td style="color:#64748b">’+(u.checks_left||0)+” left</td>”
+’<td><button class="btn btn-gh btn-sm" onclick="userView(\''+u.id+'\')">View</button></td>’
+”</tr>”;
}).join(””);
}
function userView(id){
var u=_users.find(function(x){return x.id===id;});if(!u)return;
GET(“payments”,“user_id=eq.”+id+”&select=*&order=created_at.desc”).then(function(pays){
openMd(’<h3>’+(u.full_name||u.email||“User”)+’</h3>’
+’<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px">’
+’<div style="display:flex;justify-content:space-between"><span style="color:#475569;font-size:12px">Email</span><span style="color:#f1f5f9;font-size:12px">’+(u.email||”—”)+’</span></div>’

+’<div style="display:flex;justify-content:space-between"><span style="color:#475569;font-size:12px">Total Paid</span><span style="color:#10b981;font-size:12px">GHC ‘+((u._p||0)/100).toFixed(2)+’</span></div>’
+’<div style="display:flex;justify-content:space-between"><span style="color:#475569;font-size:12px">Checks Left</span><span style="color:#f1f5f9;font-size:12px">’+(u.checks_left||0)+’</span></div></div>’
+’<p style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px">Payment History</p>’
+(!pays||!pays.length?’<p style="color:#475569;font-size:12px">No payments yet.</p>’
:’<table class="tbl"><thead><tr><th>Date</th><th>Amount</th><th>Plan</th><th>Status</th></tr></thead><tbody>’
+pays.map(function(p){return”<tr><td>”+dateStr(p.created_at)+”</td><td>GHC “+((p.amount||0)/100).toFixed(2)+”</td><td>”+(p.plan||”—”)+”</td><td>”+bdg(p.status,p.status===“success”?“g”:“o”)+”</td></tr>”;}).join(””)
+”</tbody></table>”)
+’<button class="btn btn-gh btn-fl" onclick="closeMd()" style="margin-top:12px">Close</button>’);
});
}

function showFeats(){

GET(“settings”,“key=in.(”+FEATS.map(function(f){return’”’+f.k+’”’;}).join(”,”)+”)”+”&select=key,value”).then(function(d){

el.innerHTML=FEATS.map(function(f){
var on=!!vals[f.k];
return ‘<div class="row"><div class="row-info"><h4>’+f.l+’</h4><p>’+f.d+’</p></div>’
+’<button class=“tog’+(on?” on”:””)+’” id=“ft-’+f.k+’” onclick=“featToggle('’+f.k+’',this)”><div class="tog-d"></div></button></div>’;
}).join(””);
}).catch(function(){var el=ge(“feat-bd”);if(el)el.innerHTML=’<p style="color:#fcd34d">Create a settings table in Supabase to use toggles.</p>’;});
}
function featToggle(k,btn){
var v=!btn.classList.contains(“on”);
btn.classList.toggle(“on”);
SSET(k,String(v)).then(function(){toast((v?“Enabled”:“Disabled”)+” ✅”,“success”);}).catch(function(){toast(“Error”,“error”);});
}

function pkLoad(){
GET(“settings”,“key=in.("pk_test_pub","pk_live_pub","pk_live_mode","price_basic","price_premium","price_bundle")&select=key,value”).then(function(d){
var v={};(d||[]).forEach(function(s){v[s.key]=s.value;});
if(v.pk_test_pub&&ge(“pk1”))ge(“pk1”).value=v.pk_test_pub;
if(v.pk_live_pub&&ge(“pk3”))ge(“pk3”).value=v.pk_live_pub;
if(v.price_basic&&ge(“sp1”))ge(“sp1”).value=v.price_basic;
if(v.price_premium&&ge(“sp2”))ge(“sp2”).value=v.price_premium;
if(v.price_bundle&&ge(“sp3”))ge(“sp3”).value=v.price_bundle;
var live=v.pk_live_mode===“true”;
var tog=ge(“pk-tog”),bm=ge(“pk-mode”);
if(tog){if(live)tog.classList.add(“on”);else tog.classList.remove(“on”);}
if(bm){bm.textContent=live?“🟢 Live Mode”:“⚙️ Test Mode”;bm.style.color=live?”#6ee7b7”:”#fcd34d”;}
}).catch(function(){});
}
function pkToggle(btn){
var v=!btn.classList.contains(“on”);
btn.classList.toggle(“on”);
var bm=ge(“pk-mode”);if(bm){bm.textContent=v?“🟢 Live Mode”:“⚙️ Test Mode”;bm.style.color=v?”#6ee7b7”:”#fcd34d”;}
}
function pkSave(){
var live=ge(“pk-tog”)&&ge(“pk-tog”).classList.contains(“on”);
var saves=[SSET(“pk_test_pub”,gv(“pk1”)),SSET(“pk_live_pub”,gv(“pk3”)),SSET(“pk_live_mode”,String(live))];
if(gv(“pk2”))saves.push(SSET(“pk_test_sec”,gv(“pk2”)));
if(gv(“pk4”))saves.push(SSET(“pk_live_sec”,gv(“pk4”)));
Promise.all(saves).then(function(){toast(“Keys saved ✅”,“success”);}).catch(function(){toast(“Error”,“error”);});
}
function spSave(){
Promise.all([SSET(“price_basic”,gv(“sp1”)),SSET(“price_premium”,gv(“sp2”)),SSET(“price_bundle”,gv(“sp3”))])
.then(function(){toast(“Prices saved ✅”,“success”);}).catch(function(){toast(“Error”,“error”);});
}
