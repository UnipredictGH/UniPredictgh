<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniPredict Admin</title>
<style>
body { font-family: Arial, sans-serif; background: #0f0f1a; color: #e2e8f0; margin: 0; }
#top { background: #161625; padding: 14px 18px; border-bottom: 2px solid #7C3AED; display: flex; justify-content: space-between; align-items: center; }
#top h1 { font-size: 16px; color: #a78bfa; margin: 0; }
#tabs { background: #161625; display: flex; overflow-x: auto; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,.1); }
.tab { padding: 12px 14px; font-size: 13px; font-weight: 600; color: #64748b; border: none; background: none; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; font-family: Arial, sans-serif; }
.tab.on { color: #a78bfa; border-bottom-color: #7C3AED; }
#main { padding: 20px; }
.card { background: #161625; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; color: #f1f5f9; margin: 0 0 8px 0; }
.card p { font-size: 13px; color: #64748b; margin: 0; }
</style>
</head>
<body>
<div id="top">
  <h1>UniPredict Ghana Admin</h1>
  <a href="https://uni-predict.netlify.app" target="_blank" style="color:#a78bfa;font-size:12px;">Student Site</a>
</div>
<div id="tabs"></div>
<div id="main"></div>

<script>
var cur = "dash";
var tabs = [
  {id:"dash",    label:"Dashboard"},
  {id:"unis",    label:"Universities"},
  {id:"progs",   label:"Programmes"},
  {id:"ai",      label:"AI Inbox"},
  {id:"schols",  label:"Scholarships"},
  {id:"news",    label:"News"},
  {id:"forms",   label:"Forms"},
  {id:"anns",    label:"Announcements"},
  {id:"pays",    label:"Payments"},
  {id:"users",   label:"Users"},
  {id:"appear",  label:"Appearance"},
  {id:"stext",   label:"Site Text"},
  {id:"feats",   label:"Toggles"},
  {id:"pstack",  label:"Paystack"}
];

function buildTabs() {
  var el = document.getElementById("tabs");
  el.innerHTML = "";
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    var b = document.createElement("button");
    b.className = "tab" + (cur === t.id ? " on" : "");
    b.textContent = t.label;
    b.setAttribute("data-id", t.id);
    b.onclick = function() {
      cur = this.getAttribute("data-id");
      buildTabs();
      showPage(cur);
    };
    el.appendChild(b);
  }
}

function showPage(id) {
  var m = document.getElementById("main");
  m.innerHTML = "";
  var titles = {
    dash:"Dashboard", unis:"Universities", progs:"Programmes",
    ai:"AI Inbox", schols:"Scholarships", news:"News",
    forms:"Admission Forms", anns:"Announcements", pays:"Payments",
    users:"Users", appear:"Appearance", stext:"Site Text",
    feats:"Toggles", pstack:"Paystack"
  };
  var card = document.createElement("div");
  card.className = "card";
  var h2 = document.createElement("h2");
  h2.textContent = titles[id] || id;
  var p = document.createElement("p");
  p.textContent = "Loading " + (titles[id] || id) + "...";
  card.appendChild(h2);
  card.appendChild(p);
  m.appendChild(card);
}

buildTabs();
showPage("dash");
</script>

</body>
</html>
