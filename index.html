<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniPredict Ghana — Admin Panel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* ── RESET ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #111827; font-size: 13px; }
      button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }
      input, select, textarea { font-family: inherit; font-size: 13px; border: none; outline: none; background: transparent; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

      /* ── LAYOUT ── */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-1 { flex: 1; }
      .flex-shrink-0 { flex-shrink: 0; }
      .items-center { align-items: center; }
      .items-start { align-items: flex-start; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .gap-1 { gap: 4px; }
      .gap-2 { gap: 8px; }
      .gap-3 { gap: 12px; }
      .gap-4 { gap: 16px; }
      .grid { display: grid; }
      .grid-cols-2 { grid-template-columns: 1fr 1fr; }
      .grid-cols-4 { grid-template-columns: repeat(4,1fr); }
      .col-span-2 { grid-column: span 2; }
      .w-full { width: 100%; }
      .min-h-screen { min-height: 100vh; }
      .overflow-hidden { overflow: hidden; }
      .overflow-y-auto { overflow-y: auto; }
      .overflow-x-auto { overflow-x: auto; }
      .min-w-0 { min-width: 0; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .whitespace-nowrap { white-space: nowrap; }
      .self-start { align-self: flex-start; }
      .ml-auto { margin-left: auto; }
      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .opacity-60 { opacity: .6; }
      .sticky { position: sticky; }
      .top-0 { top: 0; }
      .h-screen { height: 100vh; }

      /* ── SPACING ── */
      .p-2 { padding: 8px; }
      .p-3 { padding: 12px; }
      .p-4 { padding: 16px; }
      .p-5 { padding: 20px; }
      .p-6 { padding: 24px; }
      .p-8 { padding: 32px; }
      .p-12 { padding: 48px; }
      .px-2 { padding-left: 8px; padding-right: 8px; }
      .px-3 { padding-left: 12px; padding-right: 12px; }
      .px-4 { padding-left: 16px; padding-right: 16px; }
      .px-5 { padding-left: 20px; padding-right: 20px; }
      .py-1 { padding-top: 4px; padding-bottom: 4px; }
      .py-2 { padding-top: 8px; padding-bottom: 8px; }
      .py-2\.5 { padding-top: 10px; padding-bottom: 10px; }
      .py-3 { padding-top: 12px; padding-bottom: 12px; }
      .mb-1 { margin-bottom: 4px; }
      .mb-2 { margin-bottom: 8px; }
      .mb-3 { margin-bottom: 12px; }
      .mb-4 { margin-bottom: 16px; }
      .mb-5 { margin-bottom: 20px; }
      .mt-3 { margin-top: 12px; }
      .mt-4 { margin-top: 16px; }
      .space-y-2 > * + * { margin-top: 8px; }
      .space-y-3 > * + * { margin-top: 12px; }
      .space-y-4 > * + * { margin-top: 16px; }
      .max-w-sm { max-width: 24rem; }
      .max-w-lg { max-width: 32rem; }
      .max-w-2xl { max-width: 42rem; }
      .max-w-xl { max-width: 36rem; }
      .max-w-md { max-width: 28rem; }
      .max-w-\[180px\] { max-width: 180px; }
      .max-w-\[140px\] { max-width: 140px; }
      .max-w-\[120px\] { max-width: 120px; }
      .max-w-\[180px\] { max-width: 180px; }
      .w-9 { width: 36px; }
      .h-9 { height: 36px; }
      .w-8 { width: 32px; }
      .h-8 { height: 32px; }
      .w-14 { width: 56px; }
      .w-52 { width: 208px; }
      .w-16 { width: 64px; }
      .w-40 { width: 160px; }
      .w-24 { width: 96px; }
      .w-32 { width: 128px; }
      .w-5 { width: 20px; }
      .h-2 { height: 8px; }
      .h-1\.5 { height: 6px; }
      .h-24 { height: 96px; }
      .h-4 { height: 16px; }
      .h-2 { height: 8px; }
      .flex-wrap { flex-wrap: wrap; }
      .float-right { float: right; }

      /* ── TEXT ── */
      .text-xs { font-size: 12px; }
      .text-sm { font-size: 14px; }
      .text-xl { font-size: 20px; }
      .text-base { font-size: 16px; }
      .font-black { font-weight: 900; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
      .font-mono { font-family: monospace; }
      .leading-none { line-height: 1; }
      .leading-tight { line-height: 1.25; }
      .text-center { text-align: center; }
      .text-left { text-align: left; }
      .uppercase { text-transform: uppercase; }
      .tracking-wide { letter-spacing: .05em; }

      /* ── COLORS ── */
      .text-gray-400 { color: #9ca3af; }
      .text-gray-500 { color: #6b7280; }
      .text-gray-600 { color: #4b5563; }
      .text-gray-700 { color: #374151; }
      .text-white { color: #fff; }
      .text-violet-600 { color: #7c3aed; }
      .text-violet-700 { color: #6d28d9; }
      .text-green-600 { color: #059669; }
      .text-amber-700 { color: #92400e; }
      .text-blue-700 { color: #1d4ed8; }
      .text-green-700 { color: #047857; }
      .bg-gray-50 { background: #f9fafb; }
      .bg-white { background: #fff; }
      .bg-violet-50 { background: #f5f3ff; }
      .bg-violet-600 { background: #7c3aed; }
      .bg-amber-50 { background: #fffbeb; }
      .bg-amber-500 { background: #f59e0b; }
      .bg-green-50 { background: #f0fdf4; }
      .bg-green-500 { background: #10b981; }
      .bg-blue-50 { background: #eff6ff; }
      .bg-gray-900 { background: #111827; }
      .bg-gray-800 { background: #1f2937; }
      .bg-gray-100 { background: #f3f4f6; }
      .bg-green-100 { background: #dcfce7; }
      .bg-red-100 { background: #fee2e2; }
      .bg-amber-100 { background: #fef3c7; }
      .bg-violet-100 { background: #ede9fe; }
      .bg-blue-100 { background: #dbeafe; }
      .bg-emerald-500 { background: #10b981; }
      .bg-red-500 { background: #ef4444; }
      .bg-gradient-to-br { background: linear-gradient(135deg, var(--from), var(--to)); }
      .from-violet-600 { --from: #7c3aed; }
      .to-pink-500 { --to: #ec4899; }

      /* ── BORDERS ── */
      .border { border: 1px solid #e5e7eb; }
      .border-2 { border-width: 2px; border-style: solid; }
      .border-b { border-bottom: 1px solid #e5e7eb; }
      .border-t { border-top: 1px solid #e5e7eb; }
      .border-l-2 { border-left-width: 2px; border-left-style: solid; }
      .border-gray-100 { border-color: #f3f4f6; }
      .border-gray-200 { border-color: #e5e7eb; }
      .border-gray-800 { border-color: #1f2937; }
      .border-transparent { border-color: transparent; }
      .border-violet-400 { border-color: #a78bfa; }
      .border-violet-600 { border-color: #7c3aed; }
      .border-amber-200 { border-color: #fde68a; }
      .border-amber-500 { border-color: #f59e0b; }
      .border-green-200 { border-color: #bbf7d0; }
      .border-green-500 { border-color: #10b981; }
      .border-blue-200 { border-color: #bfdbfe; }
      .rounded-lg { border-radius: 8px; }
      .rounded-xl { border-radius: 12px; }
      .rounded-2xl { border-radius: 16px; }
      .rounded-full { border-radius: 9999px; }

      /* ── SHADOWS ── */
      .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,.05); }
      .shadow-2xl { box-shadow: 0 25px 50px rgba(0,0,0,.25); }
      .shadow-xl { box-shadow: 0 20px 25px rgba(0,0,0,.15); }

      /* ── TRANSITIONS ── */
      .transition-all { transition: all .15s; }
      .duration-200 { transition-duration: .2s; }
      .cursor-pointer { cursor: pointer; }
      .cursor-not-allowed { cursor: not-allowed; }
      .pointer-events-none { pointer-events: none; }

      /* ── SPECIFIC COMPONENTS ── */
      .card { background: #fff; border-radius: 12px; border: 1px solid #f3f4f6; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

      /* Fixed/absolute */
      .fixed { position: fixed; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .z-50 { z-index: 50; }

      /* Table */
      table { width: 100%; border-collapse: collapse; }
      th { padding: 10px 12px; text-align: left; font-size: 10px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .05em; background: #f9fafb; border-bottom: 1px solid #f3f4f6; }
      td { padding: 10px 12px; font-size: 12px; border-bottom: 1px solid #f9fafb; color: #374151; }
      tr:hover td { background: #fafafa; }

      /* Form inputs */
      .form-input { width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; background: #fff; color: #111827; font-family: inherit; }
      .form-input:focus { border-color: #7c3aed; outline: none; box-shadow: 0 0 0 2px rgba(124,58,237,.1); }

      /* Sidebar */
      #sidebar { background: #111827; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; flex-shrink: 0; transition: width .2s; }
      #sidebar nav button { display: flex; align-items: center; gap: 10px; padding: 8px 12px; width: 100%; text-align: left; color: #9ca3af; font-size: 12.5px; font-weight: 500; border-left: 2px solid transparent; transition: all .15s; }
      #sidebar nav button:hover { background: #1f2937; color: #e5e7eb; }
      #sidebar nav button.active-nav { background: #7c3aed; color: #fff; border-left-color: #a78bfa; }

      /* Badge */
      .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px; font-size: 10px; font-weight: 700; white-space: nowrap; }
      .badge-gray { background: #f3f4f6; color: #4b5563; }
      .badge-green { background: #dcfce7; color: #047857; }
      .badge-red { background: #fee2e2; color: #991b1b; }
      .badge-amber { background: #fef3c7; color: #92400e; }
      .badge-violet { background: #ede9fe; color: #6d28d9; }
      .badge-blue { background: #dbeafe; color: #1d4ed8; }

      /* Btn */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: opacity .15s; font-family: inherit; }
      .btn:disabled { opacity: .4; cursor: not-allowed; }
      .btn-primary { background: #7c3aed; color: #fff; padding: 6px 12px; font-size: 12px; }
      .btn-primary:hover:not(:disabled) { background: #6d28d9; }
      .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; }
      .btn-ghost { background: #fff; color: #374151; border: 1px solid #e5e7eb; padding: 6px 12px; font-size: 12px; }
      .btn-ghost:hover:not(:disabled) { background: #f9fafb; }
      .btn-success { background: #10b981; color: #fff; padding: 6px 12px; font-size: 12px; }
      .btn-amber { background: #f59e0b; color: #fff; padding: 6px 12px; font-size: 12px; }
      .btn-sm { padding: 4px 10px !important; font-size: 11px !important; }
      .btn-lg { padding: 10px 20px !important; font-size: 14px !important; }
      .btn-full { width: 100%; justify-content: center; }

      /* Toast */
      .toast { position: fixed; bottom: 16px; right: 16px; background: #111827; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 100; display: flex; align-items: center; gap: 8px; animation: fadeIn .2s ease; }
      @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

      /* Modal */
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
      .modal-box { background: #fff; border-radius: 16px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,.3); }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #f3f4f6; }
      .modal-body { padding: 20px; }

      /* Stat cards */
      .stat-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }

      /* Bar chart */
      .bar { background: #7c3aed; border-radius: 3px 3px 0 0; }
      .bar-green { background: #10b981; }

      /* Tab bar */
      .tab-bar { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 20px; overflow-x: auto; }
      .tab-bar::-webkit-scrollbar { display: none; }
      .tab-btn { padding: 8px 16px; font-size: 12px; font-weight: 600; white-space: nowrap; border: none; border-bottom: 2px solid transparent; background: none; color: #9ca3af; cursor: pointer; margin-bottom: -2px; font-family: inherit; }
      .tab-btn.active { border-bottom-color: #7c3aed; color: #7c3aed; }
      .tab-btn:hover:not(.active) { color: #4b5563; }

      /* Checklist */
      .space-y-2 > * + * { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
