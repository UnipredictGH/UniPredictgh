<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UniPredict Ghana — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pur:#7C3AED;--pink:#EC4899;--grn:#10b981;--red:#ef4444;--amb:#f59e0b;--blu:#3b82f6;
  --surf:#161625;--surf2:#1e1e32;--surf3:#252540;
  --bdr:rgba(255,255,255,.07);--bdr2:rgba(255,255,255,.12);
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --grad:linear-gradient(135deg,#7C3AED,#EC4899);
}
body{font-family:"Inter",sans-serif;background:#0f0f1a;color:#e2e8f0;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;color-scheme:dark}
/* LAYOUT */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:248px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto}
.s-logo{padding:20px;border-bottom:1px solid var(--bdr)}
.s-logo h1{font-family:"Outfit",sans-serif;font-size:16px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.s-logo p{font-size:11px;color:var(--t3);margin-top:2px}
.nav-sec{padding:6px 0}
.nav-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:10px 18px 4px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--t2);border-left:2px solid transparent;transition:all .15s;position:relative}
.ni:hover{color:var(--t1);background:rgba(124,58,237,.08)}
.ni.on{color:#fff;background:rgba(124,58,237,.15);border-left-color:var(--pur);font-weight:600}
.ni .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.ni .badge{position:absolute;right:14px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;min-width:18px;text-align:center}
.s-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--bdr)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;background:var(--surf)}
.topbar h2{font-family:"Outfit",sans-serif;font-size:17px;font-weight:800;color:var(--t1)}
.content{flex:1;overflow-y:auto;padding:24px}
/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:16px}
.stat-val{font-family:"Outfit",sans-serif;font-size:30px;font-weight:900;color:var(--t1);line-height:1}
.stat-lbl{font-size:12px;color:var(--t2);margin-top:4px;font-weight:500}
.stat-chg{font-size:11.5px;font-weight:700;margin-top:6px}
/* CARDS */
.acard{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:14px}
.acard-hd{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.acard-hd h3{font-family:"Outfit",sans-serif;font-size:14px;font-weight:800;color:var(--t1)}
.acard-body{padding:18px}
/* BUTTONS */
.abtn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;font-family:"Inter",sans-serif;font-weight:600;border-radius:8px;transition:all .15s;white-space:nowrap;font-size:13px;text-decoration:none}
.abtn:disabled{opacity:.4;cursor:not-allowed}
.ab-g{background:var(--grad);color:#fff;padding:8px 16px}
.ab-g:hover{opacity:.88}
.ab-sec{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.3);padding:7px 13px}
.ab-sec:hover{background:rgba(124,58,237,.25)}
.ab-red{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);padding:7px 13px}
.ab-red:hover{background:rgba(239,68,68,.25)}
.ab-grn{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);padding:7px 13px}
.ab-grn:hover{background:rgba(16,185,129,.25)}
.ab-amb{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3);padding:7px 13px}
.ab-ghost{background:transparent;color:var(--t2);border:1px solid var(--bdr);padding:7px 13px}
.ab-ghost:hover{color:var(--t1);border-color:rgba(255,255,255,.15)}
.ab-full{width:100%;justify-content:center;display:flex}
/* INPUTS */
.ainp{width:100%;padding:9px 12px;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;color:var(--t1);font-size:13.5px;font-family:"Inter",sans-serif;outline:none}
.ainp:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.ainp::placeholder{color:var(--t3)}
.asel{width:100%;padding:9px 12px;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;color:var(--t1);font-size:13.5px;font-family:"Inter",sans-serif;outline:none;cursor:pointer}
.asel:focus{border-color:var(--pur)}
.albl{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px;display:block}
.afg{margin-bottom:12px}
.ata{width:100%;padding:9px 12px;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;color:var(--t1);font-size:13px;font-family:"Inter",sans-serif;outline:none;resize:vertical;min-height:80px}
.ata:focus{border-color:var(--pur)}
/* TABLE */
.atbl{width:100%;border-collapse:collapse;font-size:13px}
.atbl th{padding:9px 12px;text-align:left;font-size:10.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--bdr)}
.atbl td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.atbl tr:hover td{background:rgba(255,255,255,.02)}
/* BADGES */
.abg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.abg-pur{background:rgba(124,58,237,.2);color:#a78bfa}
.abg-grn{background:rgba(16,185,129,.15);color:#6ee7b7}
.abg-red{background:rgba(239,68,68,.15);color:#fca5a5}
.abg-amb{background:rgba(245,158,11,.15);color:#fcd34d}
.abg-gray{background:rgba(255,255,255,.08);color:var(--t2)}
.abg-blu{background:rgba(59,130,246,.15);color:#93c5fd}
/* MODAL */
.amov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;backdrop-filter:blur(4px)}
.amov.on{display:flex}
.amodal{background:var(--surf);border:1px solid var(--bdr2);border-radius:14px;padding:24px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;position:relative}
.amodal h3{font-family:"Outfit",sans-serif;font-size:17px;font-weight:800;color:var(--t1);margin-bottom:16px}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;cursor:pointer;font-size:20px;color:var(--t3);line-height:1}
/* TOGGLE */
.tog{width:42px;height:23px;background:rgba(255,255,255,.1);border-radius:99px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.tog.on{background:var(--pur)}
.tog-dot{width:17px;height:17px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s}
.tog.on .tog-dot{left:22px}
/* GRID */
.ag2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ag3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* SEARCH */
.srch{position:relative;margin-bottom:14px}
.srch input{padding-left:34px}
.srch::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
/* TOAST */
.toasts{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surf2);border:1px solid var(--bdr2);border-radius:8px;padding:11px 15px;font-size:13px;color:var(--t1);display:flex;align-items:center;gap:10px;min-width:220px;box-shadow:0 4px 24px rgba(0,0,0,.5);animation:toastin .2s ease}
@keyframes toastin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f1a}
.login-box{width:100%;max-width:360px;padding:20px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-family:"Outfit",sans-serif;font-weight:900;font-size:22px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-logo p{font-size:13px;color:var(--t2);margin-top:5px}
.err-box{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 13px;margin-bottom:14px;font-size:13px;color:#fca5a5;display:none}
/* CHAT INBOX */
.chat-msg{background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:10px}
.chat-q{font-size:13.5px;color:var(--t1);margin-bottom:8px;line-height:1.5}
.chat-meta{font-size:11.5px;color:var(--t3);margin-bottom:10px}
.chat-reply-box{display:flex;gap:8px;margin-top:8px}
.chat-reply-box textarea{flex:1;padding:8px 10px;background:var(--surf3);border:1px solid var(--bdr);border-radius:8px;color:var(--t1);font-size:13px;font-family:Inter,sans-serif;resize:none;outline:none;min-height:60px}
.chat-reply-box textarea:focus{border-color:var(--pur)}
/* SETTINGS SECTION */
.set-sec{margin-bottom:24px}
.set-sec-title{font-family:Outfit,sans-serif;font-size:13px;font-weight:800;color:var(--t1);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.set-row:last-child{border-bottom:none}
.set-info h4{font-size:13.5px;font-weight:600;color:var(--t1)}
.set-info p{font-size:12px;color:var(--t3);margin-top:2px}
/* COLOR SWATCH */
.color-inp{width:40px;height:32px;padding:0;border:1px solid var(--bdr);border-radius:6px;cursor:pointer;background:none}
/* PAYSTACK */
.pk-mode{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pk-test{background:rgba(245,158,11,.15);color:#fcd34d}
.pk-live{background:rgba(16,185,129,.15);color:#6ee7b7}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
/* PAGINATION */
.pag{display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:center}
.pag button{padding:5px 10px;border-radius:6px;border:1px solid var(--bdr);background:var(--surf2);color:var(--t2);font-size:12.5px;cursor:pointer}
.pag button.on{background:var(--pur);color:#fff;border-color:var(--pur)}
.pag button:hover:not(.on){color:var(--t1)}
</style>
</head>
<body>

<!-- LOGIN PAGE (DISABLED) -->

<div id="login-page" style="display:none">
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <h1>UniPredict Ghana</h1>
      <p>Admin Control Panel</p>
    </div>
    <div class="err-box" id="login-err"></div>
    <div class="afg"><label class="albl">Email</label><input class="ainp" id="l-email" type="email" placeholder="admin@unipredict.gh" autocomplete="username"/></div>
    <div class="afg"><label class="albl">Password</label><input class="ainp" id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="abtn ab-g ab-full" id="login-btn" onclick="doLogin()" style="margin-top:8px;padding:11px">Sign In to Admin →</button>
  </div>
</div>
</div>

<!-- ADMIN APP -->

<div id="admin-app" style="display:block;height:100vh">
  <div class="layout">
    <aside class="sidebar">
      <div class="s-logo">
        <h1>UniPredict Admin</h1>
        <p id="admin-email-lbl">Control Panel</p>
      </div>
      <div id="sidebar-nav"></div>
      <div class="s-foot">
        <a href="https://uni-predict.netlify.app" target="_blank" style="display:block;font-size:12px;color:var(--t2);text-decoration:none;margin-bottom:10px">🌐 View Student Site ↗</a>
        <button class="abtn ab-red ab-full" onclick="doLogout()">Sign Out</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <h2 id="page-title">Dashboard</h2>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:7px;height:7px;border-radius:50%;background:var(--grn)"></div>
          <span style="font-size:12.5px;color:var(--grn);font-weight:600">Live</span>
        </div>
      </div>
      <div class="content" id="main-content"></div>
    </div>
  </div>
</div>

<!-- MODAL -->

<div class="amov" id="a-modal">
  <div class="amodal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<!-- TOASTS -->

<div class="toasts" id="toasts"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
var SUPA_URL = "https://urfqevstrwsrtysbllah.supabase.co";
var SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";
var TOKEN = null;
TOKEN = SUPA_ANON;
var AI_INBOX_INTERVAL = null;

// ══════════════════════════════════════════
// SUPABASE HELPERS
// ══════════════════════════════════════════
function H(extra){
  var h={"apikey":SUPA_ANON,"Content-Type":"application/json"};
  if(TOKEN) h["Authorization"]="Bearer "+TOKEN;
  return Object.assign(h,extra||{});
}
function sbGet(table,q){
  return fetch(SUPA_URL+"/rest/v1/"+table+"?"+(q||"")+"&limit=1000",{headers:H()}).then(r=>r.json());
}
function sbPost(table,body){
  return fetch(SUPA_URL+"/rest/v1/"+table,{method:"POST",headers:H({"Prefer":"return=representation"}),body:JSON.stringify(body)}).then(r=>r.json());
}
function sbPatch(table,id,body){
  return fetch(SUPA_URL+"/rest/v1/"+table+"?id=eq."+id,{method:"PATCH",headers:H({"Prefer":"return=representation"}),body:JSON.stringify(body)}).then(r=>r.json());
}
function sbDelete(table,id){
  return fetch(SUPA_URL+"/rest/v1/"+table+"?id=eq."+id,{method:"DELETE",headers:H()});
}
function sbRpc(fn,body){
  return fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:H(),body:JSON.stringify(body||{})}).then(r=>r.json());
}
function settingGet(key){
  return fetch(SUPA_URL+"/rest/v1/settings?key=eq."+key+"&select=value",{headers:H()}).then(r=>r.json()).then(d=>d&&d[0]?d[0].value:null);
}
function settingSet(key,val){
  return fetch(SUPA_URL+"/rest/v1/settings?key=eq."+key,{method:"PATCH",headers:H({"Prefer":"return=representation"}),body:JSON.stringify({value:val,updated_at:new Date().toISOString()})}).then(r=>r.json()).then(d=>{
    if(!d||!d.length) return fetch(SUPA_URL+"/rest/v1/settings",{method:"POST",headers:H({"Prefer":"return=representation"}),body:JSON.stringify({key:key,value:val})}).then(r=>r.json());
    return d;
  });
}

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
function doLogin(){
  var email=document.getElementById("l-email").value.trim();
  var pass=document.getElementById("l-pass").value;
  var err=document.getElementById("login-err");
  var btn=document.getElementById("login-btn");
  err.style.display="none";
  if(!email||!pass){err.textContent="Enter email and password.";err.style.display="block";return;}
  btn.innerHTML="<span class='spin'></span> Signing in...";
  fetch(SUPA_URL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"apikey":SUPA_ANON,"Content-Type":"application/json"},
    body:JSON.stringify({email,password:pass})
  }).then(r=>r.json()).then(d=>{
    if(d&&d.access_token){
      TOKEN=d.access_token;
      document.getElementById("login-page").style.display="none";
      document.getElementById("admin-app").style.display="block";
      var el=document.getElementById("admin-email-lbl");
      if(el) el.textContent=email;
      initAdmin();
    } else {
      err.textContent="⚠️ "+(d.error_description||d.message||"Invalid credentials");
      err.style.display="block";
      btn.textContent="Sign In to Admin →";
    }
  }).catch(e=>{
    err.textContent="⚠️ Network error. Try again.";
    err.style.display="block";
    btn.textContent="Sign In to Admin →";
  });
}
function doLogout(){if(confirm("Sign out of admin?"))location.reload();}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
var NAV=[
  {sec:"Overview",items:[{id:"dashboard",ic:"📊",lbl:"Dashboard"}]},
  {sec:"Content",items:[
    {id:"universities",ic:"🏛️",lbl:"Universities"},
    {id:"programmes",ic:"📚",lbl:"Programmes"},
    {id:"scholarships",ic:"🎓",lbl:"Scholarships"},
    {id:"news",ic:"📰",lbl:"News"},
    {id:"forms",ic:"📝",lbl:"Admission Forms"},
    {id:"announcements",ic:"📢",lbl:"Announcements"}
  ]},
  {sec:"AI Inbox",items:[
    {id:"ai-inbox",ic:"🤖",lbl:"AI Inbox",badge:true}
  ]},
  {sec:"Business",items:[
    {id:"payments",ic:"💳",lbl:"Payments"},
    {id:"users",ic:"👥",lbl:"Users"}
  ]},
  {sec:"Site Control",items:[
    {id:"appearance",ic:"🎨",lbl:"Appearance"},
    {id:"content-edit",ic:"✏️",lbl:"Edit Site Text"},
    {id:"features",ic:"🔧",lbl:"Features & Toggles"},
    {id:"paystack",ic:"🔑",lbl:"Paystack Keys"},
    {id:"settings",ic:"⚙️",lbl:"Settings"}
  ]}
];
var TITLES={dashboard:"Dashboard",universities:"Universities",programmes:"Programmes",scholarships:"Scholarships",news:"News",forms:"Admission Forms",announcements:"Announcements","ai-inbox":"AI Counsellor Inbox",payments:"Payments",users:"Users",appearance:"Appearance",  "content-edit":"Edit Site Text",features:"Features & Toggles",paystack:"Paystack Keys",settings:"Settings"};
var currentPage="dashboard";
var aiUnreadCount=0;

function initAdmin(){
  checkAIInbox();
  AI_INBOX_INTERVAL=setInterval(checkAIInbox,30000);
  renderSidebar();
  showPage("dashboard");
}
function checkAIInbox(){
  sbGet("ai_inbox","status=eq.pending&select=id").then(d=>{
    aiUnreadCount=(d&&d.length)||0;
    var badge=document.getElementById("ai-badge");
    if(badge) badge.textContent=aiUnreadCount>0?aiUnreadCount:"";
    badge&&(badge.style.display=aiUnreadCount>0?"inline":"none");
  }).catch(()=>{});
}
function renderSidebar(){
  var el=document.getElementById("sidebar-nav");
  if(!el) return;
  el.innerHTML=NAV.map(sec=>
    "<div class='nav-sec'><div class='nav-lbl'>"+sec.sec+"</div>"
    +sec.items.map(item=>
      "<div class='ni"+(currentPage===item.id?" on":"")+"' onclick='showPage(\""+item.id+"\")'>"
      +"<span class='ic'>"+item.ic+"</span>"+item.lbl
      +(item.badge?"<span class='badge' id='ai-badge' style='display:"+(aiUnreadCount>0?"inline":"none")+"'>"+aiUnreadCount+"</span>":"")
      +"</div>"
    ).join("")+"</div>"
  ).join("");
}
function showPage(id){
  currentPage=id;
  renderSidebar();
  var t=document.getElementById("page-title");
  if(t) t.textContent=TITLES[id]||id;
  var pages={
    dashboard:renderDashboard,universities:renderUnis,programmes:renderProgs,
    scholarships:renderSchols,news:renderNews,forms:renderForms,announcements:renderAnns,
    "ai-inbox":renderAIInbox,payments:renderPayments,users:renderUsers,
    appearance:renderAppearance,"content-edit":renderContentEdit,
    features:renderFeatures,paystack:renderPaystack,settings:renderSettings
  };
  if(pages[id]) pages[id]();
}

// ══════════════════════════════════════════
// TOAST & MODAL
// ══════════════════════════════════════════
function toast(msg,type){
  var icons={success:"✅",error:"❌",info:"ℹ️",warn:"⚠️"};
  var el=document.createElement("div");
  el.className="toast";el.innerHTML=(icons[type]||"ℹ️")+" "+msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>el.remove(),3500);
}
function openModal(html){
  document.getElementById("modal-body").innerHTML=html;
  document.getElementById("a-modal").classList.add("on");
}
function closeModal(){document.getElementById("a-modal").classList.remove("on");}

var allUnis=[];
function renderUnis(){
  var el=document.getElementById("main-content");
  el.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div><h3 style="font-family:Outfit,sans-serif;font-weight:800;font-size:17px;color:var(--t1)">Universities</h3>
    <p style="font-size:12.5px;color:var(--t2);margin-top:2px" id="uni-count">Loading...</p></div>
    <button class="abtn ab-g" onclick="openUniModal(null)">+ Add University</button>
  </div>
  <div class="srch"><input class="ainp" placeholder="Search universities..." oninput="filterUnis(this.value)"/></div>
  <div class="acard"><table class="atbl">
    <thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Region</th><th>Status</th><th>Progs</th><th>Actions</th></tr></thead>
    <tbody id="uni-tbody"><tr><td colspan="7" style="text-align:center;padding:40px;color:var(--t2)">Loading...</td></tr></tbody>
  </table></div>`;
  Promise.all([
    sbGet("universities","order=name.asc&select=*"),
    sbGet("programmes","select=university_id")
  ]).then(([unis,progs])=>{
    allUnis=unis||[];
    var progCount={};
    (progs||[]).forEach(p=>{progCount[p.university_id]=(progCount[p.university_id]||0)+1;});
    allUnis.forEach(u=>u._progs=progCount[u.id]||0);
    renderUniRows(allUnis);
    var c=document.getElementById("uni-count");
    if(c) c.textContent=allUnis.length+" universities in database";
  });
}
function renderUniRows(data){
  var tb=document.getElementById("uni-tbody");
  if(!tb) return;
  if(!data.length){tb.innerHTML="<tr><td colspan='7' style='text-align:center;padding:30px;color:var(--t2)'>No universities found.</td></tr>";return;}
  tb.innerHTML=data.map(u=>`
    <tr>
      <td><span class="abg abg-pur">${u.code}</span></td>
      <td style="font-weight:600;color:var(--t1);max-width:200px">${u.name}</td>
      <td><span class="abg ${u.type==="Public"?"abg-grn":u.type==="Private"?"abg-amb":"abg-blu"}">${u.type||"—"}</span></td>
      <td style="color:var(--t2);font-size:12px">${u.region||"—"}</td>
      <td><span class="abg ${u.active?"abg-grn":"abg-red"}">${u.active?"Active":"Hidden"}</span></td>
      <td style="color:var(--t2)">${u._progs}</td>
      <td><div style="display:flex;gap:5px">
        <button class="abtn ab-ghost" onclick='openUniModal(${JSON.stringify(u).replace(/"/g,"&quot;")})'>Edit</button>
        <button class="abtn ${u.active?"ab-amb":"ab-grn"}" onclick="toggleUni('${u.id}',${!u.active})">${u.active?"Hide":"Show"}</button>
        <button class="abtn ab-red" onclick="delUni('${u.id}')">Del</button>
      </div></td>
    </tr>`).join("");
}
function filterUnis(q){
  var f=allUnis.filter(u=>!q||(u.name+u.code+u.region+u.type).toLowerCase().includes(q.toLowerCase()));
  renderUniRows(f);
}
function toggleUni(id,active){
  sbPatch("universities",id,{active,updated_at:new Date().toISOString()}).then(()=>{toast(active?"University shown ✅":"University hidden","info");renderUnis();});
}
function delUni(id){
  if(!confirm("Delete this university? All its programmes will also be deleted.")) return;
  sbDelete("universities",id).then(()=>{toast("Deleted","info");renderUnis();});
}
function openUniModal(u){
  openModal(`
    <h3>${u?"Edit":"Add"} University</h3>
    <div class="afg"><label class="albl">Code (e.g. UCC)</label><input class="ainp" id="u-code" value="${u?u.code:""}" placeholder="e.g. KNUST"/></div>
    <div class="afg"><label class="albl">Full Name</label><input class="ainp" id="u-name" value="${u?u.name:""}" placeholder="Kwame Nkrumah University..."/></div>
    <div class="afg"><label class="albl">Short Name</label><input class="ainp" id="u-short" value="${u?u.short_name||"":""}" placeholder="e.g. KNUST"/></div>
    <div class="ag2">
      <div class="afg"><label class="albl">Type</label>
        <select class="asel" id="u-type">
          ${["Public","Private","Technical","Distance"].map(t=>`<option ${u&&u.type===t?"selected":""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="afg"><label class="albl">Founded</label><input class="ainp" id="u-founded" type="number" value="${u?u.founded||"":""}" placeholder="1961"/></div>
    </div>
    <div class="ag2">
      <div class="afg"><label class="albl">Location (City)</label><input class="ainp" id="u-loc" value="${u?u.location||"":""}" placeholder="Kumasi"/></div>
      <div class="afg"><label class="albl">Region</label>
        <select class="asel" id="u-region">
          ${["Greater Accra","Ashanti","Central","Eastern","Western","Western North","Volta","Oti","Northern","North East","Savannah","Upper East","Upper West","Bono","Bono East","Ahafo"].map(r=>`<option ${u&&u.region===r?"selected":""}>${r}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="afg"><label class="albl">Website</label><input class="ainp" id="u-web" value="${u?u.website||"":""}" placeholder="https://knust.edu.gh"/></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="abtn ab-g" onclick="saveUni('${u?u.id:""}')">💾 Save University</button>
      <button class="abtn ab-ghost" onclick="closeModal()">Cancel</button>
    </div>`);
}
function saveUni(id){
  var code=document.getElementById("u-code").value.trim().toUpperCase();
  var name=document.getElementById("u-name").value.trim();
  if(!code||!name){toast("Code and name are required","error");return;}
  var body={code,name,short_name:document.getElementById("u-short").value.trim()||code,
    type:document.getElementById("u-type").value,
    location:document.getElementById("u-loc").value.trim(),
    region:document.getElementById("u-region").value,
    founded:parseInt(document.getElementById("u-founded").value)||null,
    website:document.getElementById("u-web").value.trim(),
    active:true,updated_at:new Date().toISOString()};
  var p=id?sbPatch("universities",id,body):sbPost("universities",body);
  p.then(()=>{toast(id?"University updated ✅":"University added ✅","success");closeModal();renderUnis();});
}

  Promise.all([
    sbGet("programmes","order=created_at.desc&select=*"),
    sbGet("universities","select=id,code,name,short_name&order=name.asc")
  ]).then(([progs,unis])=>{
    allProgs=progs||[];filteredProgs=allProgs;progUnis=unis||[];progPage=0;
    var sel=document.getElementById("prog-uni-f");
    if(sel) unis.forEach(u=>{var o=document.createElement("option");o.value=u.id;o.textContent=u.short_name||u.code;sel.appendChild(o);});
    renderProgRows();
    var c=document.getElementById("prog-count");
    if(c) c.textContent=allProgs.length+" total programmes";
  });
}
function filterProgs(){
  var q=(document.getElementById("prog-search")||{}).value||"";
  var uid=(document.getElementById("prog-uni-f")||{}).value||"";
  var deg=(document.getElementById("prog-deg-f")||{}).value||"";
  filteredProgs=allProgs.filter(p=>
    (!q||p.name.toLowerCase().includes(q.toLowerCase()))&&
    (!uid||p.university_id===uid)&&
    (!deg||p.degree===deg)
  );
  progPage=0;renderProgRows();
}
function renderProgRows(){
  var tb=document.getElementById("prog-tbody");
  if(!tb) return;
  var start=progPage*progPerPage,end=start+progPerPage;
  var pageData=filteredProgs.slice(start,end);
  if(!pageData.length){tb.innerHTML="<tr><td colspan='7' style='text-align:center;padding:30px;color:var(--t2)'>No programmes found.</td></tr>";
    document.getElementById("prog-pag").innerHTML="";return;}
  var uniMap={};progUnis.forEach(u=>uniMap[u.id]=u.short_name||u.code);
  tb.innerHTML=pageData.map(p=>`
    <tr>
      <td><span class="abg abg-pur">${uniMap[p.university_id]||"?"}</span></td>
      <td style="color:var(--t1);font-weight:500;max-width:220px">${p.name}</td>
      <td><span class="abg abg-gray">${p.degree||"—"}</span></td>
      <td style="color:var(--t2)">${p.cutoff||"—"}</td>
      <td style="color:var(--t2);font-size:12px;max-width:120px">${p.fee||"—"}</td>
      <td><span class="abg ${p.active?"abg-grn":"abg-red"}">${p.active?"Active":"Hidden"}</span></td>
      <td><div style="display:flex;gap:5px">
        <button class="abtn ab-ghost" onclick='openProgModal(${JSON.stringify(p).replace(/"/g,"&quot;")})'>Edit</button>
        <button class="abtn ${p.active?"ab-amb":"ab-grn"}" onclick="toggleProg('${p.id}',${!p.active})">${p.active?"Hide":"Show"}</button>
        <button class="abtn ab-red" onclick="delProg('${p.id}')">Del</button>
      </div></td>
    </tr>`).join("");
  var pages=Math.ceil(filteredProgs.length/progPerPage);
  var pag=document.getElementById("prog-pag");
  if(pag&&pages>1){
    pag.innerHTML="<div class='pag'>"+Array.from({length:Math.min(pages,10)},(_,i)=>`<button class="${i===progPage?"on":""}" onclick="progPage=${i};renderProgRows()">${i+1}</button>`).join("")+(pages>10?"<span style='color:var(--t2);font-size:12px'>..."+pages+" pages</span>":"")+"</div>";
  } else if(pag) pag.innerHTML="";
}
function toggleProg(id,active){sbPatch("programmes",id,{active}).then(()=>{toast(active?"Shown":"Hidden","info");var p=allProgs.find(x=>x.id===id);if(p)p.active=active;renderProgRows();});}
function delProg(id){if(!confirm("Delete this programme?"))return;sbDelete("programmes",id).then(()=>{toast("Deleted","info");allProgs=allProgs.filter(p=>p.id!==id);filteredProgs=filteredProgs.filter(p=>p.id!==id);renderProgRows();});}

function saveProg(id){
var name=document.getElementById(“p-name”).value.trim();
var uniId=document.getElementById(“p-uni”).value;
if(!name||!uniId){toast(“University and name are required”,“error”);return;}
var tracks=document.getElementById(“p-tracks”).value.split(”,”).map(t=>t.trim()).filter(Boolean);
var body={university_id:uniId,name,degree:document.getElementById(“p-deg”).value,
duration:document.getElementById(“p-dur”).value.trim(),
cutoff:parseInt(document.getElementById(“p-cut”).value)||null,
required_track:tracks,fee:document.getElementById(“p-fee”).value.trim(),
careers:document.getElementById(“p-careers”).value.trim(),active:true,updated_at:new Date().toISOString()};
var pr=id?sbPatch(“programmes”,id,body):sbPost(“programmes”,body);
pr.then(()=>{toast(id?“Updated ✅”:“Added ✅”,“success”);closeModal();renderProgs();});
}

// ══════════════════════════════════════════
function renderAIInbox(){
var el=document.getElementById(“main-content”);
el.innerHTML=`

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
      <h3 style="font-family:Outfit,sans-serif;font-weight:800;font-size:17px;color:var(--t1)">AI Counsellor Inbox</h3>
      <p style="font-size:12.5px;color:var(--t2);margin-top:2px">Questions the AI couldn't answer — reply here and it shows to the student in real time.</p>
    </div>
    <div style="display:flex;gap:8px">
      <select class="asel" id="ai-filter" style="width:130px" onchange="loadAIInbox()">
        <option value="pending">Unanswered</option>
        <option value="answered">Answered</option>
        <option value="">All</option>
      </select>
      <button class="abtn ab-sec" onclick="loadAIInbox()">🔄 Refresh</button>
    </div>
  </div>
  <div id="ai-inbox-list"><div style="text-align:center;padding:40px;color:var(--t2)">Loading...</div></div>`;
  loadAIInbox();
}
function loadAIInbox(){
  var status=(document.getElementById("ai-filter")||{}).value;
  var q=status?"status=eq."+status:"";
  sbGet("ai_inbox",q+"&order=created_at.desc&select=*").then(msgs=>{
    aiUnreadCount=(msgs||[]).filter(m=>m.status==="pending").length;
    var badge=document.getElementById("ai-badge");
    if(badge){badge.textContent=aiUnreadCount>0?aiUnreadCount:"";badge.style.display=aiUnreadCount>0?"inline":"none";}
    var el=document.getElementById("ai-inbox-list");
    if(!el) return;
    if(!msgs||!msgs.length){el.innerHTML=`<div style="text-align:center;padding:60px;color:var(--t2)">
      <div style="font-size:40px;margin-bottom:12px">🤖</div>
      <div style="font-size:14px">No questions yet. When AI can't answer, questions appear here.</div>
    </div>`;return;}
    el.innerHTML=msgs.map(m=>`
      <div class="chat-msg" id="msg-${m.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
          <span class="abg ${m.status==="pending"?"abg-red":"abg-grn"}">${m.status==="pending"?"⏳ Unanswered":"✅ Answered"}</span>
          <span style="font-size:11px;color:var(--t3)">${new Date(m.created_at).toLocaleString()}</span>
        </div>
        <div class="chat-q">💬 "${m.question}"</div>
        <div class="chat-meta">👤 ${m.user_email||"Anonymous"} ${m.user_id?"· User ID: "+m.user_id:""}</div>
        ${m.status==="answered"&&m.reply?`<div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:10px 12px;font-size:13px;color:#6ee7b7;margin-bottom:8px">✅ Your reply: "${m.reply}"</div>`:""}
        ${m.status==="pending"?`
          <div class="chat-reply-box">
            <textarea id="reply-${m.id}" placeholder="Type your reply here... it will show to the student instantly"></textarea>
            <div style="display:flex;flex-direction:column;gap:6px">
              <button class="abtn ab-g" onclick="sendAIReply('${m.id}')">Send ↗</button>
              <button class="abtn ab-red" onclick="dismissAI('${m.id}')">Dismiss</button>
            </div>
          </div>`:`
          <button class="abtn ab-ghost" onclick="reopenAI('${m.id}')">↩ Reopen</button>`}
      </div>`).join("");
  }).catch(()=>{
    var el=document.getElementById("ai-inbox-list");
    if(el) el.innerHTML=`<div style="text-align:center;padding:40px;color:var(--t2)">
      <p>⚠️ ai_inbox table not found.</p>
      <p style="margin-top:8px;font-size:12px">Run this SQL in Supabase to enable:</p>
      <pre style="background:var(--surf2);padding:12px;border-radius:8px;text-align:left;font-size:12px;margin-top:8px;overflow:auto">CREATE TABLE IF NOT EXISTS public.ai_inbox (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  question text NOT NULL,
  user_id uuid,
  user_email text,
  status text DEFAULT 'pending',
  reply text,
  replied_at timestamptz,
  created_at timestamptz DEFAULT now()
);
GRANT ALL ON public.ai_inbox TO anon;</pre>
    </div>`;
  });
}
function sendAIReply(id){
  var reply=(document.getElementById("reply-"+id)||{}).value||"";
  if(!reply.trim()){toast("Type a reply first","warn");return;}
  sbPatch("ai_inbox",id,{reply:reply.trim(),status:"answered",replied_at:new Date().toISOString()})
    .then(()=>{toast("Reply sent ✅","success");loadAIInbox();});
}
function dismissAI(id){sbPatch("ai_inbox",id,{status:"answered",reply:"[Dismissed by admin]"}).then(()=>{toast("Dismissed","info");loadAIInbox();});}
function reopenAI(id){sbPatch("ai_inbox",id,{status:"pending",reply:null}).then(()=>{toast("Reopened","info");loadAIInbox();});}

function renderSchols(){
var el=document.getElementById(“main-content”);
el.innerHTML=`

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h3 style="font-family:Outfit,sans-serif;font-weight:800;font-size:17px;color:var(--t1)">Scholarships</h3>

  </div>
  <div id="schol-list"><div style="text-align:center;padding:30px;color:var(--t2)">Loading...</div></div>`;
  loadSchols();
}
function loadSchols(){
  sbGet("scholarships","order=created_at.desc&select=*").then(d=>{
    var el=document.getElementById("schol-list");if(!el)return;
    if(!d||!d.length){el.innerHTML="<div style='text-align:center;padding:40px;color:var(--t2)'>No scholarships yet. Add one!</div>";return;}
    el.innerHTML=d.map(s=>`
      <div class="acard">
        <div class="acard-hd">
          <div>
            <h3>${s.title}</h3>
            <span style="font-size:12px;color:var(--t2)">${s.provider||""} ${s.deadline?"· Deadline: "+s.deadline:""}</span>
          </div>
          <div style="display:flex;gap:6px">
            <span class="abg ${s.active?"abg-grn":"abg-red"}">${s.active?"Active":"Hidden"}</span>
            <button class="abtn ab-ghost" onclick='openScholModal(${JSON.stringify(s).replace(/"/g,"&quot;")})'>Edit</button>
            <button class="abtn ab-red" onclick="delSchol('${s.id}')">Del</button>
          </div>
        </div>
        <div class="acard-body" style="font-size:13px;color:var(--t2)">${s.description||"No description."}</div>
      </div>`).join("");
  });
}
function openScholModal(s){
  openModal(`
    <h3>${s?"Edit":"Add"} Scholarship</h3>
    <div class="afg"><label class="albl">Title</label><input class="ainp" id="sc-title" value="${s?s.title:""}" placeholder="Ghana Education Trust Fund..."/></div>
    <div class="afg"><label class="albl">Provider / Organisation</label><input class="ainp" id="sc-prov" value="${s?s.provider||"":""}" placeholder="GETFund"/></div>
    <div class="ag2">
      <div class="afg"><label class="albl">Amount</label><input class="ainp" id="sc-amt" value="${s?s.amount||"":""}" placeholder="Full tuition"/></div>
      <div class="afg"><label class="albl">Deadline</label><input class="ainp" id="sc-dead" type="date" value="${s?s.deadline||"":""}"/></div>
    </div>
    <div class="afg"><label class="albl">Description</label><textarea class="ata" id="sc-desc">${s?s.description||"":""}</textarea></div>
    <div class="afg"><label class="albl">Apply Link (URL)</label><input class="ainp" id="sc-link" value="${s?s.link||"":""}" placeholder="https://..."/></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="abtn ab-g" onclick="saveSchol('${s?s.id:""}')">💾 Save</button>
      <button class="abtn ab-ghost" onclick="closeModal()">Cancel</button>
    </div>`);
}
function saveSchol(id){
  var title=document.getElementById("sc-title").value.trim();
  if(!title){toast("Title required","error");return;}
  var body={title,provider:document.getElementById("sc-prov").value.trim(),
    amount:document.getElementById("sc-amt").value.trim(),
    deadline:document.getElementById("sc-dead").value||null,
    description:document.getElementById("sc-desc").value.trim(),
    link:document.getElementById("sc-link").value.trim(),active:true};
  var p=id?sbPatch("scholarships",id,body):sbPost("scholarships",body);
  p.then(()=>{toast(id?"Updated ✅":"Added ✅","success");closeModal();loadSchols();});
}
function delSchol(id){if(!confirm("Delete scholarship?"))return;sbDelete("scholarships",id).then(()=>{toast("Deleted","info");loadSchols();});}

        <select class="asel" id="n-cat">

        </select>
      </div>
      <div class="afg"><label class="albl">Image URL (optional)</label><input class="ainp" id="n-img" value="${n?n.image_url||"":""}" placeholder="https://..."/></div>
    </div>
    <div class="afg"><label class="albl">Summary (short)</label><input class="ainp" id="n-sum" value="${n?n.summary||"":""}" placeholder="Brief description shown on cards"/></div>

function saveNews(id){
  var title=document.getElementById("n-title").value.trim();
  if(!title){toast("Title required","error");return;}

    pinned:document.getElementById("n-pin").classList.contains("on"),active:true};

function delNews(id){if(!confirm("Delete news?"))return;sbDelete("news",id).then(()=>{toast("Deleted","info");loadNews();});}

    el.innerHTML=`<div class="acard"><table class="atbl">
      <thead><tr><th>University</th><th>Form Title</th><th>Price</th><th>Deadline</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${forms.map(f=>`
        <tr>
          <td style="color:var(--t2);font-size:12px">${uniMap[f.university_id]||"—"}</td>
          <td style="color:var(--t1);font-weight:500">${f.title}</td>
          <td style="color:var(--t2)">GHC ${f.price||0}</td>
          <td style="color:var(--t2);font-size:12px">${f.deadline||"—"}</td>
          <td><span class="abg ${f.open?"abg-grn":"abg-red"}">${f.open?"Open":"Closed"}</span></td>

            <button class="abtn ab-red" onclick="delForm('${f.id}')">Del</button>
          </div></td>
        </tr>`).join("")}
      </tbody></table></div>`;
  });
}
function openFormModal(f){
  sbGet("universities","select=id,name&order=name.asc").then(unis=>{
    var uniOpts=(unis||[]).map(u=>`<option value="${u.id}" ${f&&f.university_id===u.id?"selected":""}>${u.name}</option>`).join("");
    openModal(`
      <h3>${f?"Edit":"Add"} Admission Form</h3>
      <div class="afg"><label class="albl">University</label><select class="asel" id="af-uni">${uniOpts}</select></div>
      <div class="afg"><label class="albl">Form Title</label><input class="ainp" id="af-title" value="${f?f.title:""}" placeholder="2025/2026 Admission Form"/></div>
      <div class="ag2">
        <div class="afg"><label class="albl">Price (GHC)</label><input class="ainp" id="af-price" type="number" value="${f?f.price||"":""}" placeholder="150"/></div>
        <div class="afg"><label class="albl">Deadline</label><input class="ainp" id="af-dead" type="date" value="${f?f.deadline||"":""}"/></div>
      </div>
      <div class="afg"><label class="albl">Form Link (URL)</label><input class="ainp" id="af-link" value="${f?f.link||"":""}" placeholder="https://..."/></div>
      <div class="afg"><label class="albl">Notes</label><textarea class="ata" id="af-notes">${f?f.notes||"":""}</textarea></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="abtn ab-g" onclick="saveForm('${f?f.id:""}')">💾 Save</button>
        <button class="abtn ab-ghost" onclick="closeModal()">Cancel</button>
      </div>`);
  });
}
function saveForm(id){
  var body={university_id:document.getElementById("af-uni").value,title:document.getElementById("af-title").value.trim(),
    price:parseFloat(document.getElementById("af-price").value)||0,deadline:document.getElementById("af-dead").value||null,
    link:document.getElementById("af-link").value.trim(),notes:document.getElementById("af-notes").value.trim(),open:true};
  var p=id?sbPatch("admission_forms",id,body):sbPost("admission_forms",body);
  p.then(()=>{toast(id?"Updated ✅":"Added ✅","success");closeModal();loadForms();});
}
function toggleForm(id,open){sbPatch("admission_forms",id,{open}).then(()=>{toast(open?"Form opened":"Form closed","info");loadForms();});}
function delForm(id){if(!confirm("Delete form?"))return;sbDelete("admission_forms",id).then(()=>{toast("Deleted","info");loadForms();});}

function renderPayments(){
var el=document.getElementById(“main-content”);
el.innerHTML=`

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
      <h3 style="font-family:Outfit,sans-serif;font-weight:800;font-size:17px;color:var(--t1)">Payments</h3>
      <p style="font-size:12.5px;color:var(--t2);margin-top:2px" id="pay-summary">Loading...</p>
    </div>
    <select class="asel" id="pay-filter" style="width:140px" onchange="loadPayments()">
      <option value="">All</option>
      <option value="success">Successful</option>
      <option value="pending">Pending</option>
      <option value="failed">Failed</option>
      <option value="refunded">Refunded</option>
    </select>
  </div>
  <div class="acard"><table class="atbl">
    <thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Reference</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="pay-tbody"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--t2)">Loading...</td></tr></tbody>
  </table></div>`;
  loadPayments();
}
function loadPayments(){
  var status=(document.getElementById("pay-filter")||{}).value;
  var q=status?"status=eq."+status:"";
  sbGet("payments",q+"&order=created_at.desc&select=*").then(d=>{
    var tb=document.getElementById("pay-tbody");if(!tb)return;
    var total=(d||[]).filter(p=>p.status==="success").reduce((s,p)=>s+(p.amount||0),0);
    var sm=document.getElementById("pay-summary");
    if(sm) sm.textContent=(d||[]).length+" records · GHC "+(total/100).toFixed(2)+" collected";
    if(!d||!d.length){tb.innerHTML="<tr><td colspan='6' style='text-align:center;padding:30px;color:var(--t2)'>No payments found.</td></tr>";return;}
    tb.innerHTML=d.map(p=>`
      <tr>
        <td style="color:var(--t2);font-size:12px">${new Date(p.created_at).toLocaleDateString()}</td>
        <td style="color:var(--t1)">${p.user_email||p.user_id||"—"}</td>
        <td style="color:var(--t1);font-weight:600">GHC ${((p.amount||0)/100).toFixed(2)}</td>
        <td style="color:var(--t2);font-size:12px">${p.reference||"—"}</td>
        <td><span class="abg ${p.status==="success"?"abg-grn":p.status==="pending"?"abg-amb":p.status==="refunded"?"abg-blu":"abg-red"}">${p.status}</span></td>
        <td><div style="display:flex;gap:5px">
          ${p.status==="pending"?`<button class="abtn ab-grn" onclick="approvePay('${p.id}')">Approve</button>`:``}
          ${p.status==="success"?`<button class="abtn ab-ghost" onclick="refundPay('${p.id}')">Refund</button>`:""}
        </div></td>
      </tr>`).join("");
  });
}
function approvePay(id){sbPatch("payments",id,{status:"success",verified_at:new Date().toISOString()}).then(()=>{toast("Approved ✅","success");loadPayments();});}
function refundPay(id){if(!confirm("Mark as refunded?"))return;sbPatch("payments",id,{status:"refunded"}).then(()=>{toast("Refunded","info");loadPayments();});}

// USERS
// ══════════════════════════════════════════
function renderUsers(){
var el=document.getElementById(“main-content”);
el.innerHTML=`

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
      <h3 style="font-family:Outfit,sans-serif;font-weight:800;font-size:17px;color:var(--t1)">Users</h3>
      <p style="font-size:12.5px;color:var(--t2);margin-top:2px" id="user-count">Loading...</p>
    </div>
    <div class="srch" style="margin:0;width:220px"><input class="ainp" placeholder="Search users..." oninput="filterUsers(this.value)"/></div>
  </div>
  <div class="acard"><table class="atbl">
    <thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Paid</th><th>Programme Checks</th><th>Actions</th></tr></thead>
    <tbody id="user-tbody"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--t2)">Loading...</td></tr></tbody>
  </table></div>`;
  var allUsers=[];
  Promise.all([sbGet("profiles","order=created_at.desc&select=*"),sbGet("payments","status=eq.success&select=user_id,amount"),sbGet("checks","select=user_id")]).then(([users,pays,checks])=>{
    var payMap={};(pays||[]).forEach(p=>payMap[p.user_id]=(payMap[p.user_id]||0)+(p.amount||0));
    var checkMap={};(checks||[]).forEach(c=>checkMap[c.user_id]=(checkMap[c.user_id]||0)+1);
    allUsers=(users||[]).map(u=>({...u,_paid:payMap[u.id]||0,_checks:checkMap[u.id]||0}));
    var c=document.getElementById("user-count");if(c) c.textContent=allUsers.length+" registered users";
    renderUserRows(allUsers);
    window._allUsers=allUsers;
  });
}
function filterUsers(q){if(!window._allUsers)return;renderUserRows(q?window._allUsers.filter(u=>(u.email||u.full_name||"").toLowerCase().includes(q.toLowerCase())):window._allUsers);}
function renderUserRows(data){
  var tb=document.getElementById("user-tbody");if(!tb)return;
  if(!data.length){tb.innerHTML="<tr><td colspan='6' style='text-align:center;padding:30px;color:var(--t2)'>No users found.</td></tr>";return;}
  tb.innerHTML=data.map(u=>`
    <tr>
      <td style="color:var(--t1);font-weight:500">${u.full_name||u.name||"—"}</td>
      <td style="color:var(--t2);font-size:12.5px">${u.email||"—"}</td>

    var vals={};(d||[]).forEach(s=>vals[s.key]=s.value);
    if(vals.admin_title) document.getElementById("s-title").value=vals.admin_title;
    if(vals.support_email) document.getElementById("s-support").value=vals.support_email;
    if(vals.free_checks) document.getElementById("s-free-checks").value=vals.free_checks;
  }).catch(()=>{});
}
function saveGeneralSettings(){
  Promise.all([
    settingSet("admin_title",document.getElementById("s-title").value),
    settingSet("support_email",document.getElementById("s-support").value),
    settingSet("free_checks",document.getElementById("s-free-checks").value)
  ]).then(()=>toast("Settings saved ✅","success")).catch(()=>toast("Error","error"));
}
function testDB(){
  sbGet("universities","select=id&limit=1").then(d=>{
    toast(d&&d.length?"Database connected ✅":"Connected but no data","success");
  }).catch(()=>toast("Connection failed ❌","error"));
}
function exportData(){
  Promise.all([sbGet("universities","select=id"),sbGet("programmes","select=id"),sbGet("profiles","select=id"),sbGet("payments","status=eq.success&select=amount")])
    .then(([unis,progs,users,pays])=>{
      var total=(pays||[]).reduce((s,p)=>s+(p.amount||0),0);
      var report="UniPredict Ghana — Data Export\n"+new Date().toLocaleString()+"\n\n"
        +"Universities: "+(unis||[]).length+"\n"+"Programmes: "+(progs||[]).length+"\n"
        +"Users: "+(users||[]).length+"\n"+"Revenue: GHC "+(total/100).toFixed(2)+"\n";
      var blob=new Blob([report],{type:"text/plain"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="unipredict-export.txt";a.click();
    });
}
