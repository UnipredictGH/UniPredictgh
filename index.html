<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniPredict Ghana — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f0f1a;color:#e2e8f0;font-size:14px;min-height:100vh}
a,button{cursor:pointer}
/* TOP */
#top{background:#161625;border-bottom:2px solid #7C3AED;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
#top-logo{font-size:16px;font-weight:900;background:linear-gradient(135deg,#7C3AED,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#top-link{font-size:12px;color:#a78bfa;text-decoration:none;border:1px solid rgba(124,58,237,.3);padding:5px 10px;border-radius:6px;font-weight:600}
/* TABS */
#tabs{background:#161625;border-bottom:1px solid rgba(255,255,255,.07);display:flex;overflow-x:auto;padding:0 12px;gap:2px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 13px;font-size:12px;font-weight:600;color:#64748b;white-space:nowrap;border:none;background:none;border-bottom:3px solid transparent;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tab.active{color:#a78bfa;border-bottom-color:#7C3AED}
/* MAIN */
#main{padding:16px;max-width:980px;margin:0 auto;padding-bottom:80px}
/* CARD */
.card{background:#161625;border:1px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card-head{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-head h3{font-size:14px;font-weight:800;color:#f1f5f9}
.card-body{padding:16px}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:480px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.stats-grid{grid-template-columns:repeat(6,1fr)}}
.stat-box{background:#1e1e32;border-radius:10px;padding:14px 10px;text-align:center}
.stat-num{font-size:26px;font-weight:900;color:#f1f5f9}
.stat-lbl{font-size:10px;color:#64748b;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:700;border:none;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap}
.btn:active{opacity:.8}
.btn-purple{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff}
.btn-soft{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.btn-red{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-green{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-amber{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.btn-ghost{background:transparent;color:#64748b;border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-full{width:100%;justify-content:center}
/* FORM */
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7C3AED}
.field textarea{resize:vertical;min-height:68px}
.field input[type=color]{padding:3px;height:38px;cursor:pointer;background:#1e1e32}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
/* BADGE */
.badge{display:inline-flex;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
.badge-purple{background:rgba(124,58,237,.2);color:#a78bfa}
.badge-green{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-red{background:rgba(239,68,68,.15);color:#fca5a5}
.badge-amber{background:rgba(245,158,11,.15);color:#fcd34d}
.badge-blue{background:rgba(59,130,246,.15);color:#93c5fd}
.badge-gray{background:rgba(255,255,255,.07);color:#94a3b8}
/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#overlay.open{display:flex}
#modal{background:#161625;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;position:relative}
#modal h3{font-size:15px;font-weight:800;color:#f1f5f9;margin-bottom:14px}
#modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:#475569;font-size:22px;cursor:pointer;padding:4px;line-height:1;-webkit-tap-highlight-color:transparent}
/* TOGGLE */
.tog{width:44px;height:24px;background:#334155;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tog.on{background:#7C3AED}
.tog-dot{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;pointer-events:none}
.tog.on .tog-dot{left:23px}
/* ROW */
.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:10px}
.list-row:last-child{border-bottom:none}
.list-row-info h4{font-size:13px;font-weight:600;color:#f1f5f9}
.list-row-info p{font-size:11px;color:#475569;margin-top:2px}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:inherit;outline:none}
.search-wrap input:focus{border-color:#7C3AED}
/* PAGER */
.pager{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid rgba(255,255,255,.06)}
.pager-btn{padding:4px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.07);background:#1e1e32;color:#94a3b8;font-size:11px;cursor:pointer;font-family:inherit}
.pager-btn.active{background:#7C3AED;color:#fff;border-color:#7C3AED}
/* TOASTS */
#toasts{position:fixed;bottom:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#1e1e32;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:12px;color:#f1f5f9;min-width:180px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
/* MISC */
.empty{text-align:center;padding:36px;color:#475569}
.flex{display:flex;align-items:center;gap:8px}
.flex-wrap{display:flex;flex-wrap:wrap;gap:6px}
.sb{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ph{font-size:16px;font-weight:800;color:#f1f5f9;margin-bottom:14px}
.muted{color:#64748b;font-size:12px}
</style>
</head>
<body ontouchstart="">

<div id="top">
  <div id="top-logo">🎓 UniPredict Admin</div>
  <a id="top-link" href="https://uni-predict.netlify.app" target="_blank">View Student Site ↗</a>
</div>
<div id="tabs"></div>
<div id="main"></div>
<div id="toasts"></div>
<div id="overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────
var SB_URL = "https://urfqevstrwsrtysbllah.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";

// ─── SUPABASE ─────────────────────────────
function sbHeaders() {
  return { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json", "Prefer": "return=representation" };
}
function sbGet(table, q) {
  return fetch(SB_URL + "/rest/v1/" + table + "?" + (q || "") + "&limit=5000", { headers: sbHeaders() })
    .then(function(r) { return r.ok ? r.json() : r.text().then(function(t) { throw new Error(t); }); });
}
function sbPost(table, body) {
  return fetch(SB_URL + "/rest/v1/" + table, { method: "POST", headers: sbHeaders(), body: JSON.stringify(body) })
    .then(function(r) { return r.ok ? r.json() : r.text().then(function(t) { throw new Error(t); }); });
}
function sbPatch(table, id, body) {
  return fetch(SB_URL + "/rest/v1/" + table + "?id=eq." + id, { method: "PATCH", headers: sbHeaders(), body: JSON.stringify(body) })
    .then(function(r) { return r.ok ? r.json() : r.text().then(function(t) { throw new Error(t); }); });
}
function sbDel(table, id) {
  return fetch(SB_URL + "/rest/v1/" + table + "?id=eq." + id, { method: "DELETE", headers: sbHeaders() })
    .then(function(r) { if (!r.ok) throw new Error(r.status); });
}
function sbSetting(k, v) {
  var h = sbHeaders(); h["Prefer"] = "resolution=merge-duplicates";
  return fetch(SB_URL + "/rest/v1/settings", { method: "POST", headers: h, body: JSON.stringify({ key: k, value: v, updated_at: new Date().toISOString() }) })
    .then(function(r) { if (!r.ok) throw new Error("fail"); });
}

// ─── TOAST ────────────────────────────────
function toast(msg, type) {
  var el = document.createElement("div");
  el.className = "toast";
  var icons = { ok: "✅", err: "❌", info: "ℹ️", warn: "⚠️" };
  el.textContent = (icons[type] || "ℹ️") + " " + msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(function() { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(function() { el.remove(); }, 300); }, 3500);
}

// ─── MODAL ────────────────────────────────
function openModal(buildFn) {
  var body = document.getElementById("modal-body");
  body.innerHTML = "";
  buildFn(body);
  document.getElementById("overlay").className = "open";
}
function closeModal() { document.getElementById("overlay").className = ""; }
document.getElementById("modal-close").onclick = closeModal;
document.getElementById("overlay").onclick = function(e) { if (e.target === this) closeModal(); };

// ─── HELPERS ──────────────────────────────
function el(tag, props, parent) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function(k) {
    if (k === "text") e.textContent = props[k];
    else if (k === "html") e.innerHTML = props[k];
    else if (k === "cls") e.className = props[k];
    else if (k === "style") e.style.cssText = props[k];
    else e[k] = props[k];
  });
  if (parent) parent.appendChild(e);
  return e;
}
function badge(text, color) {
  var b = document.createElement("span");
  b.className = "badge badge-" + color;
  b.textContent = text;
  return b;
}
function fmtDate(d) { return d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }
function sval(id) { var e = document.getElementById(id); return e ? e.value : ""; }
function field(label, inputHtml) {
  return "<div class='field'><label>" + label + "</label>" + inputHtml + "</div>";
}
function inp(id, placeholder, value, type) {
  return "<input id='" + id + "' type='" + (type || "text") + "' placeholder='" + (placeholder || "") + "' value='" + (value || "") + "'/>";
}
function textarea(id, value) { return "<textarea id='" + id + "'>" + (value || "") + "</textarea>"; }

function select(id, options, selected) {
return “<select id='" + id + "'>” + options.map(function(o) {
var v = typeof o === “object” ? o.v : o;
var t = typeof o === “object” ? o.t : o;
return “<option value=’” + v + “’” + (v === selected ? “ selected” : “”) + “>” + t + “</option>”;
}).join(””) + “</select>”;
}
function btnRow() {
var args = Array.prototype.slice.call(arguments);
var d = document.createElement(“div”);
d.style.cssText = “display:flex;gap:8px;margin-top:14px;flex-wrap:wrap”;
args.forEach(function(b) { d.appendChild(b); });
return d;
}
function btn(text, cls, fn) {
var b = document.createElement(“button”);
b.className = “btn “ + cls;
b.textContent = text;
b.onclick = fn;
b.addEventListener(“touchend”, function(e) { e.preventDefault(); fn(); });
return b;
}
function mkBtn(text, cls) {
var b = document.createElement(“button”);
b.className = “btn “ + cls;
b.textContent = text;
return b;
}

// ─── TABS ────────────────────────────────
var TABS = [
{ id: “dash”,   label: “📊 Dashboard” },
{ id: “unis”,   label: “🏛️ Universities” },
{ id: “progs”,  label: “📚 Programmes” },
{ id: “ai”,     label: “🤖 AI Inbox” },
{ id: “schols”, label: “🎓 Scholarships” },
{ id: “news”,   label: “📰 News” },
{ id: “forms”,  label: “📝 Forms” },
{ id: “anns”,   label: “📢 Announcements” },
{ id: “pays”,   label: “💳 Payments” },
{ id: “users”,  label: “👥 Users” },
{ id: “appear”, label: “🎨 Appearance” },
{ id: “text”,   label: “✏️ Site Text” },
{ id: “feats”,  label: “🔧 Toggles” },
{ id: “pstack”, label: “🔑 Paystack” }
];
var CUR = “dash”;

function renderTabs() {
var container = document.getElementById(“tabs”);
container.innerHTML = “”;
TABS.forEach(function(t) {
var b = document.createElement(“button”);
b.className = “tab” + (CUR === t.id ? “ active” : “”);
b.textContent = t.label;
b.onclick = function() { goTo(t.id); };
b.addEventListener(“touchend”, function(e) { e.preventDefault(); goTo(t.id); });
container.appendChild(b);
});
}

function goTo(id) {
CUR = id;
renderTabs();
var m = document.getElementById(“main”);
m.innerHTML = “”;
var pages = {
dash: pageDash, unis: pageUnis, progs: pageProgs,
ai: pageAI, schols: pageSchols, news: pageNews,
forms: pageForms, anns: pageAnns, pays: pagePays,
users: pageUsers, appear: pageAppear, text: pageText,
feats: pageFeats, pstack: pagePstack
};
if (pages[id]) pages[id](m);
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function pageDash(m) {
var grid = el(“div”, { cls: “stats-grid” }, m);
var stats = [
{ id: “s-unis”,  label: “🏛️ Universities” },
{ id: “s-progs”, label: “📚 Programmes” },
{ id: “s-users”, label: “👥 Users” },
{ id: “s-rev”,   label: “💰 Revenue GHC” },
{ id: “s-pend”,  label: “⏳ Pending Pays” },
{ id: “s-ai”,    label: “🤖 AI Questions” }
];
stats.forEach(function(s) {
var box = el(“div”, { cls: “stat-box” }, grid);
el(“div”, { cls: “stat-num”, id: s.id, text: “…” }, box);
el(“div”, { cls: “stat-lbl”, text: s.label }, box);
});

var card = el(“div”, { cls: “card” }, m);
var head = el(“div”, { cls: “card-head” }, card);
el(“h3”, { text: “Quick Actions” }, head);
var body = el(“div”, { cls: “card-body flex-wrap” }, card);

[
[“🏛️ Universities”, “unis”], [“📚 Programmes”, “progs”],
[“🤖 AI Inbox”, “ai”], [“💳 Payments”, “pays”],
[“👥 Users”, “users”], [“📢 Announcements”, “anns”],
[“🎨 Appearance”, “appear”], [“🔧 Toggles”, “feats”],
[“✏️ Edit Text”, “text”], [“🔑 Paystack”, “pstack”]
].forEach(function(a) {
body.appendChild(btn(a[0], “btn btn-soft”, function(id) { return function() { goTo(id); }; }(a[1])));
});

sbGet(“universities”, “active=eq.true&select=id”).then(function(d) { var e = document.getElementById(“s-unis”); if (e) e.textContent = d.length; }).catch(function(){});
sbGet(“programmes”, “active=eq.true&select=id”).then(function(d) { var e = document.getElementById(“s-progs”); if (e) e.textContent = d.length; }).catch(function(){});
sbGet(“profiles”, “select=id”).then(function(d) { var e = document.getElementById(“s-users”); if (e) e.textContent = d.length; }).catch(function(){});
sbGet(“payments”, “status=eq.success&select=amount”).then(function(d) { var e = document.getElementById(“s-rev”); if (e) e.textContent = Math.round(d.reduce(function(s, x) { return s + (x.amount || 0); }, 0) / 100); }).catch(function(){});
sbGet(“payments”, “status=eq.pending&select=id”).then(function(d) { var e = document.getElementById(“s-pend”); if (e) e.textContent = d.length; }).catch(function(){});
sbGet(“ai_inbox”, “status=eq.pending&select=id”).then(function(d) { var e = document.getElementById(“s-ai”); if (e) e.textContent = d.length; }).catch(function(){});
}

// ═══════════════════════════════════════════════
// UNIVERSITIES
// ═══════════════════════════════════════════════
var _unis = [];
function pageUnis(m) {
var head = el(“div”, { cls: “sb”, style: “margin-bottom:12px” }, m);
el(“h2”, { cls: “ph”, style: “margin:0”, text: “Universities” }, head);
head.appendChild(btn(”+ Add University”, “btn btn-purple”, function() { uniModal(null); }));
var sw = el(“div”, { cls: “search-wrap” }, m);
var si = el(“input”, { placeholder: “Search universities…” }, sw);
si.oninput = function() { renderUniRows(si.value); };
var card = el(“div”, { cls: “card” }, m);
var tbl = el(“table”, { cls: “tbl” }, card);
var thead = el(“thead”, {}, tbl);
var hr = el(“tr”, {}, thead);
[“Code”,“Name”,“Type”,“Region”,“Progs”,“Status”,“Actions”].forEach(function(h) { el(“th”, { text: h }, hr); });
el(“tbody”, { id: “uni-tbody”, html: “<tr><td colspan='7' class='empty'>Loading…</td></tr>” }, tbl);

Promise.all([sbGet(“universities”, “order=name.asc&select=*”), sbGet(“programmes”, “select=university_id”)]).then(function(r) {
_unis = r[0] || [];
var pc = {};
(r[1] || []).forEach(function(p) { pc[p.university_id] = (pc[p.university_id] || 0) + 1; });
_unis.forEach(function(u) { u._pc = pc[u.id] || 0; });
renderUniRows(””);
}).catch(function(e) { toast(“Error loading unis: “ + e.message, “err”); });
}

function renderUniRows(q) {
var tb = document.getElementById(“uni-tbody”);
if (!tb) return;
var data = q ? _unis.filter(function(u) { return (u.name + u.code + (u.region || “”)).toLowerCase().indexOf(q.toLowerCase()) >= 0; }) : _unis;
tb.innerHTML = “”;
if (!data.length) { el(“tr”, { html: “<td colspan='7' class='empty'>No universities found</td>” }, tb); return; }
data.forEach(function(u) {
var tr = el(“tr”, {}, tb);
var codeTd = el(“td”, {}, tr); codeTd.appendChild(badge(u.code, “purple”));
el(“td”, { text: u.name, style: “font-weight:600;color:#f1f5f9;max-width:180px” }, tr);
var typeTd = el(“td”, {}, tr); typeTd.appendChild(badge(u.type || “—”, u.type === “Public” ? “green” : “amber”));
el(“td”, { text: u.region || “—”, cls: “muted” }, tr);
el(“td”, { text: u._pc, cls: “muted” }, tr);
var stTd = el(“td”, {}, tr); stTd.appendChild(badge(u.active ? “Active” : “Hidden”, u.active ? “green” : “red”));
var actTd = el(“td”, { style: “white-space:nowrap” }, tr);
var editBtn = btn(“Edit”, “btn btn-ghost btn-sm”, function(uid) { return function() { uniModal(_unis.find(function(x) { return x.id === uid; })); }; }(u.id));
var togBtn = btn(u.active ? “Hide” : “Show”, “btn btn-sm “ + (u.active ? “btn-amber” : “btn-green”), function(uid, active) { return function() { sbPatch(“universities”, uid, { active: !active }).then(function() { toast(active ? “Hidden” : “Shown”, “ok”); goTo(“unis”); }).catch(function(e) { toast(e.message, “err”); }); }; }(u.id, u.active));
var delBtn = btn(“Del”, “btn btn-red btn-sm”, function(uid) { return function() { if (!confirm(“Delete?”)) return; sbDel(“universities”, uid).then(function() { toast(“Deleted”, “info”); goTo(“unis”); }).catch(function(e) { toast(e.message, “err”); }); }; }(u.id));
actTd.appendChild(editBtn); actTd.appendChild(document.createTextNode(” “)); actTd.appendChild(togBtn); actTd.appendChild(document.createTextNode(” “)); actTd.appendChild(delBtn);
});
}

function uniModal(u) {

section(“Bundle Plan (GHC 28)”, [“bundle_name”,“bundle_price”,“bundle_desc”,“bundle_perks”,“bundle_badge”], [“bundle_name”,“bundle_price”,“bundle_desc”,“bundle_perks”,“bundle_badge”]);
section(“Footer”, [“footer_tag”,“copyright”], [“footer_tag”,“copyright”]);
sbGet(“settings”, “key=in.(” + ST_KEYS.map(function(k) { return ‘”’ + k + ‘”’; }).join(”,”) + “)&select=key,value”).then(function(d) {
(d || []).forEach(function(s) { var e = document.getElementById(“st-” + s.key); if (e) e.value = s.value || “”; });
}).catch(function(){});
}

// ═══════════════════════════════════════════════
// TOGGLES
// ═══════════════════════════════════════════════
var FEATS = [
{ k: “maintenance_mode”,  l: “🚧 Maintenance Mode”,       d: “Show maintenance page to students” },
{ k: “ai_counsellor”,     l: “🤖 AI Counsellor”,          d: “Enable AI chat on student site” },
{ k: “payments_enabled”,  l: “💳 Payments Enabled”,        d: “Allow students to pay and subscribe” },
{ k: “registration_open”, l: “📝 Registration Open”,       d: “Allow new student registrations” },
{ k: “show_scholarships”, l: “🎓 Scholarships Page”,       d: “Show scholarships section” },
{ k: “show_news”,         l: “📰 News & Updates”,          d: “Show news section” },
{ k: “show_rankings”,     l: “🏆 University Rankings”,     d: “Show ranking table” },
{ k: “show_compare”,      l: “⚖️ Compare Universities”,    d: “Allow comparing universities” },
{ k: “show_calculator”,   l: “📐 Aggregate Calculator”,    d: “Show WASSCE aggregate calculator” },
{ k: “show_forms”,        l: “📝 Admission Forms”,         d: “Show admission forms tracker” },
{ k: “announcement_bar”,  l: “📢 Announcement Bar”,        d: “Show banner at top of site” }
];
function pageFeats(m) {
el(“h2”, { cls: “ph”, text: “Features & Toggles” }, m);
var card = el(“div”, { cls: “card” }, m);
var body = el(“div”, { cls: “card-body”, id: “feats-body”, html: “<p class='muted'>Loading…</p>” }, card);
sbGet(“settings”, “key=in.(” + FEATS.map(function(f) { return ‘”’ + f.k + ‘”’; }).join(”,”) + “)&select=key,value”).then(function(d) {
var vals = {}; (d || []).forEach(function(s) { vals[s.k] = s.value === “true”; });
body.innerHTML = “”;
FEATS.forEach(function(f) {
var row = el(“div”, { cls: “list-row” }, body);
var info = el(“div”, { cls: “list-row-info” }, row);
el(“h4”, { text: f.l }, info);
el(“p”, { text: f.d }, info);
var togEl = el(“button”, { cls: “tog” + (vals[f.k] ? “ on” : “”) }, row);
el(“div”, { cls: “tog-dot” }, togEl);
togEl.onclick = function() {
var isOn = togEl.classList.contains(“on”);
togEl.classList.toggle(“on”);
sbSetting(f.k, String(!isOn)).then(function() { toast((!isOn ? “Enabled” : “Disabled”) + “ ✅”, “ok”); }).catch(function() { toast(“Error”, “err”); });
};
});
}).catch(function() { body.innerHTML = “<p class='muted' style='color:#fcd34d'>Create a settings table in Supabase to use toggles.</p>”; });
}

// ═══════════════════════════════════════════════
// PAYSTACK
// ═══════════════════════════════════════════════
function pagePstack(m) {
el(“h2”, { cls: “ph”, text: “Paystack Keys” }, m);
var card = el(“div”, { cls: “card” }, m);
var head = el(“div”, { cls: “card-head” }, card);
el(“h3”, { text: “API Keys” }, head);
var modeEl = el(“span”, { style: “font-size:12px;font-weight:700;color:#fcd34d”, text: “⚙️ Test Mode”, id: “pk-mode” }, head);
var body = el(“div”, { cls: “card-body” }, card);
el(“div”, { style: “background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:10px;margin-bottom:14px;font-size:12px;color:#fcd34d”, text: “⚠️ Only the Public Key is used on the student site.” }, body);
body.innerHTML += “<p style='font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px'>🧪 Test Keys</p>” +
field(“Test Public Key”, inp(“pk-test-pub”, “pk_test_…”, “”)) +
field(“Test Secret Key”, “<input id='pk-test-sec' type='password' placeholder='sk_test_…'/>”) +
“<p style='font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;margin:12px 0 8px'>🟢 Live Keys</p>” +
field(“Live Public Key”, inp(“pk-live-pub”, “pk_live_…”, “”)) +
field(“Live Secret Key”, “<input id='pk-live-sec' type='password' placeholder='sk_live_…'/>”);
var liveRow = el(“div”, { cls: “list-row”, style: “margin:10px 0” }, body);
var liveInfo = el(“div”, { cls: “list-row-info” }, liveRow);
el(“h4”, { text: “Use Live Keys” }, liveInfo);
el(“p”, { text: “Switch on when your Paystack account is approved” }, liveInfo);
var liveTogEl = el(“button”, { cls: “tog”, id: “pk-live-tog” }, liveRow);
el(“div”, { cls: “tog-dot” }, liveTogEl);
liveTogEl.onclick = function() {
liveTogEl.classList.toggle(“on”);
var isLive = liveTogEl.classList.contains(“on”);
var mEl = document.getElementById(“pk-mode”);
if (mEl) { mEl.textContent = isLive ? “🟢 Live Mode” : “⚙️ Test Mode”; mEl.style.color = isLive ? “#6ee7b7” : “#fcd34d”; }
};
body.appendChild(btnRow(
btn(“Save Keys”, “btn btn-purple”, function() {
var isLive = document.getElementById(“pk-live-tog”) && document.getElementById(“pk-live-tog”).classList.contains(“on”);
var saves = [sbSetting(“pk_test_pub”, val(“pk-test-pub”)), sbSetting(“pk_live_pub”, val(“pk-live-pub”)), sbSetting(“pk_live_mode”, String(isLive))];
if (val(“pk-test-sec”)) saves.push(sbSetting(“pk_test_sec”, val(“pk-test-sec”)));
if (val(“pk-live-sec”)) saves.push(sbSetting(“pk_live_sec”, val(“pk-live-sec”)));
Promise.all(saves).then(function() { toast(“Keys saved ✅”, “ok”); }).catch(function() { toast(“Error”, “err”); });
}),
btn(“Reload”, “btn btn-ghost”, function() { pagePstack(document.getElementById(“main”)); })
));

var card2 = el(“div”, { cls: “card” }, m);
el(“div”, { cls: “card-head”, html: “<h3>Subscription Prices</h3>” }, card2);
var body2 = el(“div”, { cls: “card-body” }, card2);
body2.innerHTML = “<div class='grid3'>” +
field(“Basic Plan (GHC)”, inp(“pk-price-basic”, “12”, “”, “number”)) +
field(“Premium Plan (GHC)”, inp(“pk-price-premium”, “16”, “”, “number”)) +
field(“Bundle Plan (GHC)”, inp(“pk-price-bundle”, “28”, “”, “number”)) +
“</div>”;
body2.appendChild(btn(“Save Prices”, “btn btn-purple”, function() {
Promise.all([sbSetting(“price_basic”, val(“pk-price-basic”)), sbSetting(“price_premium”, val(“pk-price-premium”)), sbSetting(“price_bundle”, val(“pk-price-bundle”))])
.then(function() { toast(“Prices saved ✅”, “ok”); }).catch(function() { toast(“Error”, “err”); });
}));

sbGet(“settings”, “key=in.("pk_test_pub","pk_live_pub","pk_live_mode","price_basic","price_premium","price_bundle")&select=key,value”).then(function(d) {
var v = {}; (d || []).forEach(function(s) { v[s.key] = s.value; });
if (v.pk_test_pub) { var e = document.getElementById(“pk-test-pub”); if (e) e.value = v.pk_test_pub; }
if (v.pk_live_pub) { var e = document.getElementById(“pk-live-pub”); if (e) e.value = v.pk_live_pub; }
if (v.price_basic) { var e = document.getElementById(“pk-price-basic”); if (e) e.value = v.price_basic; }
if (v.price_premium) { var e = document.getElementById(“pk-price-premium”); if (e) e.value = v.price_premium; }
if (v.price_bundle) { var e = document.getElementById(“pk-price-bundle”); if (e) e.value = v.price_bundle; }
var isLive = v.pk_live_mode === “true”;
var tog = document.getElementById(“pk-live-tog”);
var mEl = document.getElementById(“pk-mode”);
if (tog && isLive) tog.classList.add(“on”);
if (mEl) { mEl.textContent = isLive ? “🟢 Live Mode” : “⚙️ Test Mode”; mEl.style.color = isLive ? “#6ee7b7” : “#fcd34d”; }
}).catch(function(){});
}

// ═══════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════
renderTabs();
goTo(“dash”);
</script>
