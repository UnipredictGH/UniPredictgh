// ─── Toast ────────────────────────────────────────────────────────────────────
function useToast() {
const [toasts, setToasts] = useState([]);
const toast = useCallback((msg, ok) => {
const id = Date.now();
setToasts(t => […t, { id, msg, ok }]);
setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
}, []);
const ToastContainer = () => (
<div style={{ position: “fixed”, bottom: 14, right: 14, zIndex: 9999, display: “flex”, flexDirection: “column”, gap: 5 }}>
{toasts.map(t => (
<div key={t.id} style={{ background: “#1e1e32”, borderLeft: `3px solid ${t.ok ? "#10b981" : "#ef4444"}`, borderRadius: 6, padding: “9px 13px”, fontSize: 12, color: “#f1f5f9”, minWidth: 180 }}>{t.msg}</div>
))}
</div>
);
return { toast, ToastContainer };
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function Modal({ children, onClose }) {
if (!children) return null;
return (
<div style={S.ov} onClick={e => e.target === e.currentTarget && onClose()}>
<div style={S.md}>
<button onClick={onClose} style={{ position: “absolute”, top: 12, right: 14, background: “none”, border: “none”, color: “#475569”, fontSize: 20, cursor: “pointer” }}>✕</button>
{children}
</div>
</div>
);
}

// ─── Field ────────────────────────────────────────────────────────────────────
function Field({ label, children, style }) {
return <div style={style}><label style={S.lbl}>{label}</label>{children}</div>;
}
function Input({ label, style, …props }) {
return <Field label={label} style={style}><input style={S.fi} {…props} /></Field>;
}
function Textarea({ label, …props }) {
return <Field label={label}><textarea style={{ …S.fi, resize: “vertical”, minHeight: 70 }} {…props} /></Field>;
}
function Select({ label, options, style, …props }) {
return <Field label={label} style={style}><select style={S.fi} {…props}>{options}</select></Field>;
}

// ─── Toggle ───────────────────────────────────────────────────────────────────
function Toggle({ on, onChange }) {
return (
<button onClick={() => onChange(!on)} style={{ width: 40, height: 22, background: on ? “#7C3AED” : “#ffffff18”, borderRadius: 99, cursor: “pointer”, position: “relative”, border: “none”, flexShrink: 0, WebkitTapHighlightColor: “transparent”, touchAction: “manipulation” }}>
<div style={{ width: 16, height: 16, background: “#fff”, borderRadius: “50%”, position: “absolute”, top: 3, left: on ? 21 : 3, transition: “left .15s” }} />
</button>
);
}

// ─── Badge ────────────────────────────────────────────────────────────────────
function Badge({ c, children }) {
return <span style={S.bge(c)}>{children}</span>;
}

function Universities({ toast }) {
const [unis, setUnis] = useState([]);
const [pc, setPc] = useState({});
const [q, setQ] = useState(””);
const [modal, setModal] = useState(null);
const [form, setForm] = useState({});

const load = useCallback(() => {
Promise.all([GET(“universities”, “order=name.asc&select=*”), GET(“programmes”, “select=university_id”)])
.then(([u, p]) => {
const counts = {};
(p||[]).forEach(x => counts[x.university_id] = (counts[x.university_id]||0)+1);
setUnis(u||[]); setPc(counts);
}).catch(() => {});
}, []);

useEffect(() => { load(); }, [load]);

const filtered = unis.filter(u => !q || (u.name+u.code+u.region).toLowerCase().includes(q.toLowerCase()));

const openModal = (u) => {
setForm(u ? { …u } : { code: “”, name: “”, short_name: “”, type: “Public”, location: “”, region: “Greater Accra”, founded: “”, website: “”, active: true });
setModal(u ? u.id : “new”);
};

const save = async () => {
if (!form.code||!form.name) { toast(“Code and name required”, false); return; }
const b = { code: form.code.toUpperCase(), name: form.name, short_name: form.short_name||form.code, type: form.type, location: form.location, region: form.region, founded: parseInt(form.founded)||null, website: form.website, active: true, updated_at: new Date().toISOString() };
try { await (modal===“new” ? POST(“universities”, b) : PATCH(“universities”, modal, b)); toast(“Saved ✅”, true); setModal(null); load(); } catch { toast(“Error saving”, false); }
};

const toggle = (id, v) => PATCH(“universities”, id, { active: v }).then(() => { toast(v?“Shown”:“Hidden”, true); load(); });
const del = (id) => { if (!confirm(“Delete university?”)) return; DEL(“universities”, id).then(() => { toast(“Deleted”, true); load(); }); };

const REGS = [“Greater Accra”,“Ashanti”,“Central”,“Eastern”,“Western”,“Western North”,“Volta”,“Oti”,“Northern”,“North East”,“Savannah”,“Upper East”,“Upper West”,“Bono”,“Bono East”,“Ahafo”];

return (

<h2 style={{ fontSize: 16, fontWeight: 800, color: “#f1f5f9” }}>Universities</h2>
<button style={S.btn(“p”)} onClick={() => openModal(null)}>+ Add University</button>

<input style={{ …S.fi, maxWidth: 280 }} placeholder=“Search…” value={q} onChange={e => setQ(e.target.value)} />
<div style={S.card}>
<table style={S.tbl}>
<thead><tr><th style={S.th}>Code</th><th style={S.th}>Name</th><th style={S.th}>Type</th><th style={S.th}>Region</th><th style={S.th}>Status</th><th style={S.th}>Progs</th><th style={S.th}>Actions</th></tr></thead>
<tbody>
{!filtered.length ? <tr><td colSpan={7} style={{ …S.td, textAlign: “center”, color: “#475569”, padding: 24 }}>None found</td></tr> :
filtered.map(u => (

<Modal onClose={() => setModal(null)}>
<h3 style={{ fontSize: 15, fontWeight: 800, color: “#f1f5f9”, marginBottom: 14 }}>{modal===“new”?“Add”:“Edit”} University</h3>

<Input label=“Short Name” value={form.short_name||””} onChange={e => setForm(f=>({…f,short_name:e.target.value}))} placeholder=“UCC” />

// PROGRAMMES
// ═══════════════════════════════════════════════════════════════════════════════
function Programmes({ toast }) {
const [progs, setProgs] = useState([]);
const [uniList, setUniList] = useState([]);
const [q, setQ] = useState(””); const [uF, setUF] = useState(””); const [dF, setDF] = useState(””);
const [pg, setPg] = useState(0);
const [modal, setModal] = useState(null);
const [form, setForm] = useState({});
const PER = 50;

const load = useCallback(() => {
Promise.all([GET(“programmes”,“order=created_at.desc&select=*”), GET(“universities”,“select=id,code,name,short_name&order=name.asc”)])
.then(([p,u]) => { setProgs(p||[]); setUniList(u||[]); setPg(0); }).catch(() => {});
}, []);

useEffect(() => { load(); }, [load]);

const umap = Object.fromEntries(uniList.map(u => [u.id, u.short_name||u.code]));
const filtered = progs.filter(p => (!q||p.name.toLowerCase().includes(q.toLowerCase())) && (!uF||p.university_id===uF) && (!dF||p.degree===dF));
const pages = Math.ceil(filtered.length/PER);
const slice = filtered.slice(pg*PER,(pg+1)*PER);

const openModal = (p) => {
setForm(p ? { …p, tracks: (p.required_track||[]).join(”, “) } : { university_id: uniList[0]?.id||””, name: “”, degree: “BSc”, duration: “”, cutoff: “”, tracks: “”, fee: “”, careers: “”, active: true });
setModal(p ? p.id : “new”);
};

const save = async () => {
if (!form.name||!form.university_id) { toast(“Name and university required”, false); return; }
const tracks = form.tracks.split(”,”).map(t=>t.trim()).filter(Boolean);
const b = { university_id: form.university_id, name: form.name, degree: form.degree, duration: form.duration, cutoff: parseInt(form.cutoff)||null, required_track: tracks, fee: form.fee, careers: form.careers, active: true, updated_at: new Date().toISOString() };
try { await (modal===“new” ? POST(“programmes”,b) : PATCH(“programmes”,modal,b)); toast(“Saved ✅”,true); setModal(null); load(); } catch { toast(“Error”,false); }
};

const toggle = (id,v) => PATCH(“programmes”,id,{active:v}).then(()=>{setProgs(pp=>pp.map(p=>p.id===id?{…p,active:v}:p)); toast(v?“Shown”:“Hidden”,true);});
const del = (id) => { if(!confirm(“Delete?”))return; DEL(“programmes”,id).then(()=>{setProgs(pp=>pp.filter(p=>p.id!==id)); toast(“Deleted”,true);}); };

const DEGS = [“BSc”,“BA”,“BEd”,“BTech”,“BBA”,“LLB”,“MBChB”,“HND”,“Diploma”,“Certificate”];

return (
<div style={S.pg}>
<div style={{ display:“flex”, justifyContent:“space-between”, alignItems:“center”, marginBottom:12 }}>
<h2 style={{ fontSize:16, fontWeight:800, color:”#f1f5f9” }}>Programmes</h2>
<button style={S.btn(“p”)} onClick={()=>openModal(null)}>+ Add Programme</button>
</div>
<div style={{ display:“flex”, gap:6, marginBottom:8, flexWrap:“wrap” }}>
<input style={{…S.fi,flex:1,minWidth:140,margin:0}} placeholder=“Search…” value={q} onChange={e=>{setQ(e.target.value);setPg(0);}} />
<select style={{…S.fi,width:160,margin:0}} value={uF} onChange={e=>{setUF(e.target.value);setPg(0);}}>
<option value="">All Universities</option>
{uniList.map(u=><option key={u.id} value={u.id}>{u.short_name||u.code}</option>)}
</select>
<select style={{…S.fi,width:110,margin:0}} value={dF} onChange={e=>{setDF(e.target.value);setPg(0);}}>
<option value="">All Degrees</option>
{DEGS.map(d=><option key={d}>{d}</option>)}
</select>
</div>
<p style={{ fontSize:12, color:”#475569”, marginBottom:8 }}>{filtered.length} programmes</p>
<div style={S.card}>
<table style={S.tbl}>
<thead><tr><th style={S.th}>Uni</th><th style={S.th}>Programme</th><th style={S.th}>Degree</th><th style={S.th}>Cutoff</th><th style={S.th}>Fee</th><th style={S.th}>Status</th><th style={S.th}>Actions</th></tr></thead>
<tbody>
{!slice.length ? <tr><td colSpan={7} style={{…S.td,textAlign:“center”,color:”#475569”,padding:20}}>No programmes</td></tr> :
slice.map(p=>(
<tr key={p.id}>

// AI INBOX
// ═══════════════════════════════════════════════════════════════════════════════
function AIInbox({ toast }) {
const [msgs, setMsgs] = useState([]);
const [filter, setFilter] = useState(“pending”);
const [replies, setReplies] = useState({});
const [err, setErr] = useState(false);

const load = useCallback(() => {
GET(“ai_inbox”, (filter?“status=eq.”+filter:””)+”&order=created_at.desc&select=*”)
.then(d => { setMsgs(d||[]); setErr(false); })
.catch(() => setErr(true));
}, [filter]);

useEffect(() => { load(); }, [load]);

const reply = (id) => {
const r = replies[id]||””; if(!r.trim()){toast(“Type a reply”,false);return;}
PATCH(“ai_inbox”,id,{reply:r,status:“answered”,replied_at:new Date().toISOString()}).then(()=>{toast(“Sent ✅”,true);load();});
};
const dismiss = (id) => PATCH(“ai_inbox”,id,{status:“answered”,reply:”[Dismissed]”}).then(()=>{toast(“Dismissed”,true);load();});
const reopen = (id) => PATCH(“ai_inbox”,id,{status:“pending”,reply:null}).then(()=>{toast(“Reopened”,true);load();});

return (
<div style={S.pg}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:12,flexWrap:“wrap”,gap:8}}>
<div>
<h2 style={{fontSize:16,fontWeight:800,color:”#f1f5f9”}}>AI Counsellor Inbox</h2>
<p style={{fontSize:12,color:”#475569”,marginTop:3}}>Questions AI could not answer — reply here</p>
</div>
<div style={{display:“flex”,gap:6}}>
<select style={{…S.fi,width:120,margin:0}} value={filter} onChange={e=>setFilter(e.target.value)}>
<option value="pending">Unanswered</option>
<option value="answered">Answered</option>
<option value="">All</option>
</select>
<button style={S.btn(“s”)} onClick={load}>🔄 Refresh</button>
</div>
</div>
{err && (
<div style={S.card}>
<div style={S.cb}>
<p style={{color:”#fcd34d”,marginBottom:10,fontSize:13}}>Run this SQL in Supabase to enable AI Inbox:</p>
<pre style={{background:”#0f0f1a”,padding:12,borderRadius:8,fontSize:11,overflow:“auto”,color:”#94a3b8”}}>{`CREATE TABLE IF NOT EXISTS public.ai_inbox ( id uuid DEFAULT gen_random_uuid() PRIMARY KEY, question text NOT NULL, user_id uuid, user_email text, status text DEFAULT 'pending', reply text, replied_at timestamptz, created_at timestamptz DEFAULT now() ); GRANT ALL ON public.ai_inbox TO anon;`}</pre>
</div>
</div>
)}
{!err && !msgs.length && <div style={{textAlign:“center”,padding:40,color:”#475569”}}><div style={{fontSize:36,marginBottom:8}}>🤖</div><p>No questions yet.</p></div>}
{msgs.map(m=>(
<div key={m.id} style={{...S.card,marginBottom:10}}>
<div style={S.cb}>
<div style={{display:“flex”,justifyContent:“space-between”,marginBottom:8,flexWrap:“wrap”,gap:6}}>
<Badge c={m.status===“pending”?“r”:“g”}>{m.status===“pending”?“⏳ Unanswered”:“✅ Answered”}</Badge>
<span style={{fontSize:11,color:”#475569”}}>{new Date(m.created_at).toLocaleString()}</span>
</div>
<p style={{fontSize:13,color:”#f1f5f9”,marginBottom:6,lineHeight:1.5}}>{m.question}</p>
<p style={{fontSize:11,color:”#475569”,marginBottom:10}}>{m.user_email||“Anonymous”}</p>
{m.status===“answered”&&m.reply&&<div style={{background:”#10b98112”,border:“1px solid #10b98133”,borderRadius:8,padding:10,fontSize:12,color:”#6ee7b7”,marginBottom:8}}>Reply: {m.reply}</div>}
{m.status===“pending”?(
<div style={{display:“flex”,gap:8,marginTop:8}}>
<textarea value={replies[m.id]||””} onChange={e=>setReplies(r=>({…r,[m.id]:e.target.value}))} style={{flex:1,padding:8,background:”#1e1e32”,border:“1px solid #ffffff12”,borderRadius:7,color:”#f1f5f9”,fontSize:12,fontFamily:“Arial”,resize:“none”,minHeight:55,outline:“none”}} placeholder=“Type reply here…” />
<div style={{display:“flex”,flexDirection:“column”,gap:5}}>
<button style={S.btn(“p”)} onClick={()=>reply(m.id)}>Send</button>
<button style={S.btn(“r”)} onClick={()=>dismiss(m.id)}>Dismiss</button>
</div>
</div>
):(
<button style={S.btn(“s”)} onClick={()=>reopen(m.id)}>↩ Reopen</button>
)}
</div>
</div>
))}
</div>
);
}

// PAYMENTS
// ═══════════════════════════════════════════════════════════════════════════════
function Payments({ toast }) {
const [items, setItems] = useState([]);
const [filter, setFilter] = useState(””);
const [summary, setSummary] = useState(””);

const load = useCallback(()=>{
GET(“payments”,(filter?“status=eq.”+filter:””)+”&order=created_at.desc&select=*”).then(d=>{
setItems(d||[]);
const rev=(d||[]).filter(p=>p.status===“success”).reduce((s,p)=>s+(p.amount||0),0);
setSummary((d||[]).length+” records · GHC “+Math.round(rev/100)+” collected”);
}).catch(()=>{});
},[filter]);
useEffect(()=>{load();},[load]);

const approve=(id)=>PATCH(“payments”,id,{status:“success”,verified_at:new Date().toISOString()}).then(()=>{toast(“Approved ✅”,true);load();});
const refund=(id)=>{if(!confirm(“Refund?”))return;PATCH(“payments”,id,{status:“refunded”}).then(()=>{toast(“Refunded”,true);load();});};

return (
<div style={S.pg}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“center”,marginBottom:12,flexWrap:“wrap”,gap:8}}>
<div>
<h2 style={{fontSize:16,fontWeight:800,color:”#f1f5f9”}}>Payments</h2>
<p style={{fontSize:12,color:”#475569”,marginTop:3}}>{summary}</p>
</div>
<select style={{…S.fi,width:120,margin:0}} value={filter} onChange={e=>setFilter(e.target.value)}>
<option value="">All</option><option value="success">Successful</option>
<option value="pending">Pending</option><option value="failed">Failed</option><option value="refunded">Refunded</option>
</select>
</div>
<div style={S.card}>
<table style={S.tbl}>
<thead><tr><th style={S.th}>Date</th><th style={S.th}>User</th><th style={S.th}>Amount</th><th style={S.th}>Ref</th><th style={S.th}>Status</th><th style={S.th}>Actions</th></tr></thead>
<tbody>
{!items.length?<tr><td colSpan={6} style={{…S.td,textAlign:“center”,color:”#475569”,padding:20}}>No payments</td></tr>:
items.map(p=>(
<tr key={p.id}>
<td style={{…S.td,color:”#94a3b8”,fontSize:11}}>{new Date(p.created_at).toLocaleDateString()}</td>
<td style={{…S.td,color:”#f1f5f9”}}>{p.user_email||p.user_id||”—”}</td>
<td style={{…S.td,fontWeight:600,color:”#f1f5f9”}}>GHC {((p.amount||0)/100).toFixed(2)}</td>
<td style={{…S.td,color:”#94a3b8”,fontSize:11}}>{p.reference||”—”}</td>
<td style={S.td}><Badge c={p.status===“success”?“g”:p.status===“pending”?“o”:p.status===“refunded”?“b”:“r”}>{p.status}</Badge></td>
<td style={S.td}>
{p.status===“pending”&&<button style={S.btn(“g”)} onClick={()=>approve(p.id)}>Approve</button>}
{p.status===“success”&&<button style={S.btn(“s”)} onClick={()=>refund(p.id)}>Refund</button>}
</td>
</tr>
))}
</tbody>
</table>
</div>
</div>
);
}

// USERS

function Users({ toast }) {
const [users, setUsers] = useState([]);
const [q, setQ] = useState(””);
const [modal, setModal] = useState(null);
const [pays, setPays] = useState([]);

Promise.all([GET(“profiles”,“order=created_at.desc&select=*”),GET(“payments”,“status=eq.success&select=user_id,amount”),GET(“checks”,“select=user_id”)])
.then(([u,p,c])=>{
const pm={},cm={};
(p||[]).forEach(x=>{pm[x.user_id]=(pm[x.user_id]||0)+(x.amount||0);});
(c||[]).forEach(x=>{cm[x.user_id]=(cm[x.user_id]||0)+1;});
setUsers((u||[]).map(x=>({…x,_p:pm[x.id]||0,_c:cm[x.id]||0})));
}).catch(()=>GET(“profiles”,“select=*”).then(d=>setUsers(d||[])).catch(()=>{}));
},[]);
useEffect(()=>{load();},[load]);

const filtered=users.filter(u=>!q||(u.email||u.full_name||””).toLowerCase().includes(q.toLowerCase()));

const viewUser=(u)=>{
setModal(u);
GET(“payments”,“user_id=eq.”+u.id+”&select=*”).then(d=>setPays(d||[])).catch(()=>setPays([]));

<div style={S.card}>

<tbody>
{!filtered.length?<tr><td colSpan={6} style={{…S.td,textAlign:“center”,color:”#475569”,padding:20}}>No users</td></tr>:
filtered.map(u=>(
<tr key={u.id}>
<td style={{…S.td,color:”#f1f5f9”,fontWeight:500}}>{u.full_name||u.name||”—”}</td>
<td style={{…S.td,color:”#94a3b8”,fontSize:11}}>{u.email||”—”}</td>
<td style={{…S.td,color:”#94a3b8”,fontSize:11}}>{new Date(u.created_at).toLocaleDateString()}</td>
<td style={{...S.td,color:(u._p||0)>0?”#10b981”:”#475569”}}>GHC {((u._p||0)/100).toFixed(2)}</td>
<td style={{…S.td,color:”#94a3b8”}}>{u._c||0}</td>
<td style={S.td}><button style={S.btn(“s”)} onClick={()=>viewUser(u)}>View</button></td>
</tr>
))}
</tbody>
</table>
</div>
{modal&&(
<Modal onClose={()=>setModal(null)}>
<h3 style={{fontSize:15,fontWeight:800,color:”#f1f5f9”,marginBottom:14}}>{modal.full_name||modal.email||“User”}</h3>
{[[“Email”,modal.email||”—”],[“Joined”,new Date(modal.created_at).toLocaleString()],[“Total Paid”,“GHC “+((modal._p||0)/100).toFixed(2)],[“Checks Done”,modal._c||0]].map(([k,v])=>(
<div key={k} style={{...S.row}}><div><h4 style={{fontSize:13,fontWeight:600,color:”#f1f5f9”}}>{k}</h4></div><span style={{color:”#94a3b8”,fontSize:12}}>{v}</span></div>

<Toggle on={!!keys.pk_live_mode} onChange={v=>setKeys(k=>({…k,pk_live_mode:v}))} />
</div>
<div style={{display:“flex”,gap:6}}><button style={S.btn(“p”)} onClick={save}>Save Keys</button></div>
</div></div>
<div style={S.card}><div style={S.ch}><h3 style={S.ch3}>Subscription Price</h3></div><div style={S.cb}>
<div style={S.g2}>
<Input label=“Price (GHC)” type=“number” value={keys.subscription_price||””} onChange={e=>setKeys(k=>({…k,subscription_price:e.target.value}))} placeholder=“20” style={{margin:0}} />
<div><label style={S.lbl}>Currency</label><select style={{…S.fi,margin:0}} value={keys.subscription_currency||“GHS”} onChange={e=>setKeys(k=>({…k,subscription_currency:e.target.value}))}><option value="GHS">GHS</option><option value="USD">USD</option></select></div>
</div>
<button style={{…S.btn(“p”),marginTop:10}} onClick={savePrice}>Save Price</button>
</div></div>
</div>
);
}

function App() {
const [tab, setTab] = useState(“dash”);
const { toast, ToastContainer } = useToast();

const PAGE = {
dash: <Dashboard />,
unis: <Universities toast={toast} />,
progs: <Programmes toast={toast} />,
ai: <AIInbox toast={toast} />,

feats: <Toggles toast={toast} />,

};

return (
<div style={S.body}>
