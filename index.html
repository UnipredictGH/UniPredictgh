<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniPredict Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#0f0f1a;color:#e2e8f0;margin:0;font-size:14px}
a,button{cursor:pointer}
#top{background:#161625;padding:12px 18px;border-bottom:2px solid #7C3AED;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
#top h1{font-size:16px;color:#a78bfa;margin:0;font-weight:900}
#top a{color:#a78bfa;font-size:12px;text-decoration:none;border:1px solid rgba(124,58,237,.3);padding:5px 10px;border-radius:6px}
#tabs{background:#161625;display:flex;overflow-x:auto;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 13px;font-size:12px;font-weight:600;color:#64748b;border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tab.on{color:#a78bfa;border-bottom-color:#7C3AED}
#main{padding:16px;max-width:980px;margin:0 auto;padding-bottom:80px}
.card{background:#161625;border:1px solid rgba(255,255,255,.07);border-radius:10px;margin-bottom:14px;overflow:hidden}
.card-head{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-head h3{font-size:14px;font-weight:800;color:#f1f5f9;margin:0}
.card-body{padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:#1e1e32;border-radius:10px;padding:14px 10px;text-align:center}
.stat-n{font-size:26px;font-weight:900;color:#f1f5f9}
.stat-l{font-size:10px;color:#64748b;margin-top:3px;font-weight:600;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:700;border:none;font-family:Arial,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;text-decoration:none}
.btn:active{opacity:.8}
.btn-p{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff}
.btn-s{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.btn-r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-g{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-o{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.btn-gh{background:transparent;color:#64748b;border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:4px 9px;font-size:11px}
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none;box-sizing:border-box}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7C3AED}
.field textarea{resize:vertical;min-height:68px}
.field input[type=color]{padding:3px;height:38px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.bdg{display:inline-flex;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
.bp{background:rgba(124,58,237,.2);color:#a78bfa}
.bg{background:rgba(16,185,129,.15);color:#6ee7b7}
.br{background:rgba(239,68,68,.15);color:#fca5a5}
.bo{background:rgba(245,158,11,.15);color:#fcd34d}
.bb{background:rgba(59,130,246,.15);color:#93c5fd}
.by{background:rgba(255,255,255,.07);color:#94a3b8}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#overlay.open{display:flex}
#modal{background:#161625;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;position:relative}
#modal h3{font-size:15px;font-weight:800;color:#f1f5f9;margin:0 0 14px 0}
#mcl{position:absolute;top:12px;right:14px;background:none;border:none;color:#475569;font-size:22px;cursor:pointer;padding:4px;line-height:1}
.tog{width:44px;height:24px;background:#334155;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;-webkit-tap-highlight-color:transparent;display:inline-block}
.tog.on{background:#7C3AED}
.tog-d{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;pointer-events:none}
.tog.on .tog-d{left:23px}
#toasts{position:fixed;bottom:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#1e1e32;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:12px;color:#f1f5f9;min-width:180px}
.lrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:10px}
.lrow:last-child{border-bottom:none}
.lrow h4{font-size:13px;font-weight:600;color:#f1f5f9;margin:0}
.lrow p{font-size:11px;color:#475569;margin:2px 0 0 0}
.empty{text-align:center;padding:36px;color:#475569}
.sb{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ph{font-size:16px;font-weight:800;color:#f1f5f9;margin:0}
.muted{color:#64748b;font-size:12px}
.pager{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid rgba(255,255,255,.06)}
.pbtn{padding:4px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.07);background:#1e1e32;color:#94a3b8;font-size:11px;cursor:pointer;font-family:Arial,sans-serif}
.pbtn.on{background:#7C3AED;color:#fff;border-color:#7C3AED}
</style>
</head>

<script>
// CONFIG
var SB = "https://urfqevstrwsrtysbllah.supabase.co";
var SK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";

// SUPABASE
function hd() { return {"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=representation"}; }
function dbGet(t,q) { return fetch(SB+"/rest/v1/"+t+"?"+(q||"")+"&limit=5000",{headers:hd()}).then(function(r){return r.ok?r.json():r.text().then(function(x){throw new Error(x);})}); }
function dbPost(t,b) { return fetch(SB+"/rest/v1/"+t,{method:"POST",headers:hd(),body:JSON.stringify(b)}).then(function(r){return r.ok?r.json():r.text().then(function(x){throw new Error(x);})}); }
function dbPatch(t,id,b) { return fetch(SB+"/rest/v1/"+t+"?id=eq."+id,{method:"PATCH",headers:hd(),body:JSON.stringify(b)}).then(function(r){return r.ok?r.json():r.text().then(function(x){throw new Error(x);})}); }
function dbDel(t,id) { return fetch(SB+"/rest/v1/"+t+"?id=eq."+id,{method:"DELETE",headers:hd()}).then(function(r){if(!r.ok)throw new Error(r.status);}); }
function dbSet(k,v) { var h=hd();h["Prefer"]="resolution=merge-duplicates";return fetch(SB+"/rest/v1/settings",{method:"POST",headers:h,body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})}).then(function(r){if(!r.ok)throw new Error("fail");}); }

// TOAST
function toast(msg,type) {
  var el=document.createElement("div");
  el.className="toast";
  var icon=type==="ok"?"OK ":"type"==="err"?"ERR ":"";
  el.textContent=msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(function(){el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(function(){el.remove();},300);},3500);
}

// MODAL
function openModal(fn) { document.getElementById("mbody").innerHTML=""; fn(document.getElementById("mbody")); document.getElementById("overlay").className="open"; }
function closeModal() { document.getElementById("overlay").className=""; }
document.getElementById("mcl").onclick = closeModal;
document.getElementById("overlay").onclick = function(e){ if(e.target===this) closeModal(); };

// UTILS
function gv(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
function sv(id){ var e=document.getElementById(id); return e?e.value:""; }
function ge(id){ return document.getElementById(id); }
function fmtDate(d){ return d?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"--"; }
function bdg(text,cls){ var s=document.createElement("span"); s.className="bdg "+cls; s.textContent=text; return s; }
function mkBtn(text,cls,fn){
  var b=document.createElement("button");
  b.className="btn "+cls;
  b.textContent=text;
  b.onclick=fn;
  b.addEventListener("touchend",function(e){e.preventDefault();fn();});
  return b;
}
function mkField(label,html){
  var d=document.createElement("div");
  d.className="field";
  d.innerHTML="<label>"+label+"</label>"+html;
  return d;
}
function mkBtnRow(){
  var d=document.createElement("div");
  d.style.cssText="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap";
  for(var i=0;i<arguments.length;i++) d.appendChild(arguments[i]);
  return d;
}
function space(){ return document.createTextNode(" "); }

// TABS
var CUR = "dash";
var TABS = [
  {id:"dash",   label:"Dashboard"},
  {id:"unis",   label:"Universities"},
  {id:"progs",  label:"Programmes"},
  {id:"ai",     label:"AI Inbox"},
  {id:"schols", label:"Scholarships"},
  {id:"news",   label:"News"},
  {id:"forms",  label:"Forms"},
  {id:"anns",   label:"Announcements"},
  {id:"pays",   label:"Payments"},
  {id:"users",  label:"Users"},
  {id:"appear", label:"Appearance"},
  {id:"stext",  label:"Site Text"},
  {id:"feats",  label:"Toggles"},
  {id:"pstack", label:"Paystack"}
];

function buildTabs() {
  var el=document.getElementById("tabs");
  el.innerHTML="";
  for(var i=0;i<TABS.length;i++){
    var t=TABS[i];
    var b=document.createElement("button");
    b.className="tab"+(CUR===t.id?" on":"");
    b.textContent=t.label;
    b.setAttribute("data-id",t.id);
    b.onclick=function(){ CUR=this.getAttribute("data-id"); buildTabs(); showPage(CUR); };
    b.addEventListener("touchend",function(e){ e.preventDefault(); CUR=this.getAttribute("data-id"); buildTabs(); showPage(CUR); });
    el.appendChild(b);
  }
}

function showPage(id){
  var m=document.getElementById("main");
  m.innerHTML="";
  var pages={dash:pgDash,unis:pgUnis,progs:pgProgs,ai:pgAI,schols:pgSchols,news:pgNews,forms:pgForms,anns:pgAnns,pays:pgPays,users:pgUsers,appear:pgAppear,stext:pgStext,feats:pgFeats,pstack:pgPstack};
  if(pages[id]) pages[id](m);
}

// DASHBOARD

function pgDash(m){
  var stats=document.createElement("div"); stats.className="stats"; m.appendChild(stats);
  var items=[{id:"s1",l:"Universities"},{id:"s2",l:"Programmes"},{id:"s3",l:"Users"},{id:"s4",l:"Revenue GHC"},{id:"s5",l:"Pending Pays"},{id:"s6",l:"AI Questions"}];
  for(var i=0;i<items.length;i++){
    var box=document.createElement("div"); box.className="stat"; stats.appendChild(box);
    var n=document.createElement("div"); n.className="stat-n"; n.id=items[i].id; n.textContent="..."; box.appendChild(n);
    var l=document.createElement("div"); l.className="stat-l"; l.textContent=items[i].l; box.appendChild(l);
  }

  var ch=document.createElement("div"); ch.className="card-head"; card.appendChild(ch);

  var cb=document.createElement("div"); cb.className="card-body"; cb.style.cssText="display:flex;gap:6px;flex-wrap:wrap"; card.appendChild(cb);
  var qs=[["Universities","unis"],["Programmes","progs"],["AI Inbox","ai"],["Payments","pays"],["Users","users"],["Announcements","anns"],["Appearance","appear"],["Toggles","feats"],["Edit Text","stext"],["Paystack","pstack"]];
  for(var j=0;j<qs.length;j++){
    cb.appendChild(mkBtn(qs[j][0],"btn btn-s",function(id){return function(){CUR=id;buildTabs();showPage(id);};}(qs[j][1])));
  }
  dbGet("universities","active=eq.true&select=id").then(function(d){var e=ge("s1");if(e)e.textContent=d.length;}).catch(function(){});
  dbGet("programmes","active=eq.true&select=id").then(function(d){var e=ge("s2");if(e)e.textContent=d.length;}).catch(function(){});
  dbGet("profiles","select=id").then(function(d){var e=ge("s3");if(e)e.textContent=d.length;}).catch(function(){});
  dbGet("payments","status=eq.success&select=amount").then(function(d){var e=ge("s4");if(e)e.textContent=Math.round(d.reduce(function(s,x){return s+(x.amount||0);},0)/100);}).catch(function(){});
  dbGet("payments","status=eq.pending&select=id").then(function(d){var e=ge("s5");if(e)e.textContent=d.length;}).catch(function(){});
  dbGet("ai_inbox","status=eq.pending&select=id").then(function(d){var e=ge("s6");if(e)e.textContent=d.length;}).catch(function(){});
}

// UNIVERSITIES
// =============================================
var _unis=[];
function pgUnis(m){
  var sb=document.createElement("div"); sb.className="sb"; m.appendChild(sb);
  var h=document.createElement("h2"); h.className="ph"; h.textContent="Universities"; sb.appendChild(h);
  sb.appendChild(mkBtn("+ Add University","btn btn-p",function(){uniModal(null);}));
  var si=document.createElement("input"); si.placeholder="Search..."; si.style.cssText="width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none;margin-bottom:12px;box-sizing:border-box"; m.appendChild(si);
  si.oninput=function(){renderUnis(si.value);};
  var card=document.createElement("div"); card.className="card"; m.appendChild(card);
  var tbl=document.createElement("table"); tbl.className="tbl"; card.appendChild(tbl);
  var thead=document.createElement("thead"); tbl.appendChild(thead);
  var hr=document.createElement("tr"); thead.appendChild(hr);
  ["Code","Name","Type","Region","Progs","Status","Actions"].forEach(function(h){var th=document.createElement("th");th.textContent=h;hr.appendChild(th);});
  var tb=document.createElement("tbody"); tb.id="uni-tb"; tbl.appendChild(tb);
  var ld=document.createElement("tr"); ld.innerHTML="<td colspan='7' class='empty'>Loading...</td>"; tb.appendChild(ld);
  Promise.all([dbGet("universities","order=name.asc&select=*"),dbGet("programmes","select=university_id")]).then(function(r){
    _unis=r[0]||[]; var pc={};
    (r[1]||[]).forEach(function(p){pc[p.university_id]=(pc[p.university_id]||0)+1;});
    _unis.forEach(function(u){u._pc=pc[u.id]||0;});
    renderUnis("");
  }).catch(function(e){toast("Error: "+e.message,"err");});
}
function renderUnis(q){
  var tb=ge("uni-tb"); if(!tb)return;
  var data=q?_unis.filter(function(u){return(u.name+u.code+(u.region||"")).toLowerCase().indexOf(q.toLowerCase())>=0;}):_unis;
  tb.innerHTML="";
  if(!data.length){var tr=document.createElement("tr");tr.innerHTML="<td colspan='7' class='empty'>None found</td>";tb.appendChild(tr);return;}
  data.forEach(function(u){
    var tr=document.createElement("tr"); tb.appendChild(tr);
    var td1=document.createElement("td"); td1.appendChild(bdg(u.code,"bdg bp")); tr.appendChild(td1);
    var td2=document.createElement("td"); td2.textContent=u.name; td2.style.cssText="font-weight:600;color:#f1f5f9;max-width:180px"; tr.appendChild(td2);
    var td3=document.createElement("td"); td3.appendChild(bdg(u.type||"--",u.type==="Public"?"bdg bg":"bdg bo")); tr.appendChild(td3);
    var td4=document.createElement("td"); td4.textContent=u.region||"--"; td4.className="muted"; tr.appendChild(td4);
    var td5=document.createElement("td"); td5.textContent=u._pc; td5.className="muted"; tr.appendChild(td5);
    var td6=document.createElement("td"); td6.appendChild(bdg(u.active?"Active":"Hidden",u.active?"bdg bg":"bdg br")); tr.appendChild(td6);
    var td7=document.createElement("td"); td7.style.whiteSpace="nowrap"; tr.appendChild(td7);
    td7.appendChild(mkBtn("Edit","btn btn-gh btn-sm",function(uid){return function(){var u=_unis.find(function(x){return x.id===uid;});if(u)uniModal(u);};}(u.id)));
    td7.appendChild(space());
    td7.appendChild(mkBtn(u.active?"Hide":"Show","btn btn-sm "+(u.active?"btn-o":"btn-g"),function(uid,act){return function(){dbPatch("universities",uid,{active:!act}).then(function(){toast(act?"Hidden":"Shown","ok");CUR="unis";buildTabs();showPage("unis");}).catch(function(e){toast(e.message,"err");});};}(u.id,u.active)));
    td7.appendChild(space());
    td7.appendChild(mkBtn("Del","btn btn-r btn-sm",function(uid){return function(){if(!confirm("Delete?"))return;dbDel("universities",uid).then(function(){toast("Deleted","ok");CUR="unis";buildTabs();showPage("unis");}).catch(function(e){toast(e.message,"err");});};}(u.id)));
  });
}

var _progs=[],_punis=[],_fp=[],_pg=0,_pp=50;
function pgProgs(m){
var sb=document.createElement(“div”); sb.className=“sb”; m.appendChild(sb);
var h=document.createElement(“h2”); h.className=“ph”; h.textContent=“Programmes”; sb.appendChild(h);

(d||[]).forEach(function(s){var e=ge(“st-”+s.key);if(e)e.value=s.value||””;});
}).catch(function(){});
}

// =============================================
// TOGGLES
// =============================================
var FEATS=[
{k:“maintenance_mode”,l:“Maintenance Mode”,d:“Show maintenance page to students”},
{k:“ai_counsellor”,l:“AI Counsellor”,d:“Enable AI chat on student site”},
{k:“payments_enabled”,l:“Payments Enabled”,d:“Allow students to pay”},
{k:“registration_open”,l:“Registration Open”,d:“Allow new registrations”},
{k:“show_scholarships”,l:“Scholarships Page”,d:“Show scholarships section”},
{k:“show_news”,l:“News and Updates”,d:“Show news section”},
{k:“show_rankings”,l:“University Rankings”,d:“Show ranking table”},
{k:“show_compare”,l:“Compare Universities”,d:“Allow comparing universities”},
{k:“show_calculator”,l:“Aggregate Calculator”,d:“Show WASSCE calculator”},
{k:“show_forms”,l:“Admission Forms”,d:“Show admission forms tracker”},
{k:“announcement_bar”,l:“Announcement Bar”,d:“Show banner at top of site”}
];
function pgFeats(m){
var h=document.createElement(“h2”); h.className=“ph”; h.style.marginBottom=“14px”; h.textContent=“Features and Toggles”; m.appendChild(h);
var card=document.createElement(“div”); card.className=“card”; m.appendChild(card);
var cb=document.createElement(“div”); cb.className=“card-body”; cb.id=“feats-body”; cb.innerHTML=”<p class='muted'>Loading…</p>”; card.appendChild(cb);
dbGet(“settings”,“key=in.(”+FEATS.map(function(f){return’”’+f.k+’”’;}).join(”,”)+”)”+”&select=key,value”).then(function(d){
var vals={}; (d||[]).forEach(function(s){vals[s.k]=s.value===“true”;});
cb.innerHTML=””;
FEATS.forEach(function(f){
var row=document.createElement(“div”); row.className=“lrow”; cb.appendChild(row);
var info=document.createElement(“div”); var h4=document.createElement(“h4”); h4.textContent=f.l; info.appendChild(h4); var p=document.createElement(“p”); p.textContent=f.d; info.appendChild(p); row.appendChild(info);
var tog=document.createElement(“button”); tog.className=“tog”+(vals[f.k]?” on”:””); row.appendChild(tog);
var dot=document.createElement(“div”); dot.className=“tog-d”; tog.appendChild(dot);
tog.onclick=function(key,btn){return function(){var on=btn.classList.contains(“on”);btn.classList.toggle(“on”);dbSet(key,String(!on)).then(function(){toast((!on?“Enabled”:“Disabled”),“ok”);}).catch(function(){toast(“Error”,“err”);});};}(f.k,tog);
});
}).catch(function(){cb.innerHTML=”<p class='muted' style='color:#fcd34d'>Create a settings table in Supabase first.</p>”;});
}

// =============================================
// PAYSTACK
// =============================================
function pgPstack(m){
var h=document.createElement(“h2”); h.className=“ph”; h.style.marginBottom=“14px”; h.textContent=“Paystack Keys”; m.appendChild(h);
var card=document.createElement(“div”); card.className=“card”; m.appendChild(card);
var ch=document.createElement(“div”); ch.className=“card-head”; card.appendChild(ch);
var ht=document.createElement(“h3”); ht.textContent=“API Keys”; ch.appendChild(ht);
var mode=document.createElement(“span”); mode.id=“pkmode”; mode.style.cssText=“font-size:12px;font-weight:700;color:#fcd34d”; mode.textContent=“Test Mode”; ch.appendChild(mode);
var cb=document.createElement(“div”); cb.className=“card-body”; card.appendChild(cb);
var warn=document.createElement(“div”); warn.style.cssText=“background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:10px;margin-bottom:14px;font-size:12px;color:#fcd34d”; warn.textContent=“Only the Public Key is used on the student site.”; cb.appendChild(warn);
var tl=document.createElement(“p”); tl.style.cssText=“font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px”; tl.textContent=“Test Keys”; cb.appendChild(tl);
cb.appendChild(mkField(“Test Public Key”,”<input id='pk1' placeholder='pk_test_...'/>”));
cb.appendChild(mkField(“Test Secret Key”,”<input id='pk2' type='password' placeholder='sk_test_...'/>”));
var ll=document.createElement(“p”); ll.style.cssText=“font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;margin:12px 0 8px 0”; ll.textContent=“Live Keys”; cb.appendChild(ll);
cb.appendChild(mkField(“Live Public Key”,”<input id='pk3' placeholder='pk_live_...'/>”));
cb.appendChild(mkField(“Live Secret Key”,”<input id='pk4' type='password' placeholder='sk_live_...'/>”));
var lrow=document.createElement(“div”); lrow.className=“lrow”; lrow.style.margin=“10px 0”; cb.appendChild(lrow);
var li=document.createElement(“div”); var lh=document.createElement(“h4”); lh.textContent=“Use Live Keys”; li.appendChild(lh); var lp=document.createElement(“p”); lp.textContent=“Switch on when Paystack account is approved”; li.appendChild(lp); lrow.appendChild(li);
var ltog=document.createElement(“button”); ltog.className=“tog”; ltog.id=“pktog”; lrow.appendChild(ltog);
var ldot=document.createElement(“div”); ldot.className=“tog-d”; ltog.appendChild(ldot);
ltog.onclick=function(){
ltog.classList.toggle(“on”);
var live=ltog.classList.contains(“on”);
var m=ge(“pkmode”); if(m){m.textContent=live?“Live Mode”:“Test Mode”;m.style.color=live?”#6ee7b7”:”#fcd34d”;}
};
cb.appendChild(mkBtnRow(
mkBtn(“Save Keys”,“btn btn-p”,function(){
var live=ge(“pktog”)&&ge(“pktog”).classList.contains(“on”);
var saves=[dbSet(“pk_test_pub”,gv(“pk1”)),dbSet(“pk_live_pub”,gv(“pk3”)),dbSet(“pk_live_mode”,String(live))];
if(gv(“pk2”))saves.push(dbSet(“pk_test_sec”,gv(“pk2”)));
if(gv(“pk4”))saves.push(dbSet(“pk_live_sec”,gv(“pk4”)));
Promise.all(saves).then(function(){toast(“Saved”,“ok”);}).catch(function(){toast(“Error”,“err”);});
}),
mkBtn(“Reload”,“btn btn-gh”,function(){pgPstack(document.getElementById(“main”));})
));
var card2=document.createElement(“div”); card2.className=“card”; m.appendChild(card2);
var ch2=document.createElement(“div”); ch2.className=“card-head”; card2.appendChild(ch2);
var ht2=document.createElement(“h3”); ht2.textContent=“Subscription Prices”; ch2.appendChild(ht2);
var cb2=document.createElement(“div”); cb2.className=“card-body”; card2.appendChild(cb2);
var g=document.createElement(“div”); g.className=“g3”; cb2.appendChild(g);
var d1=document.createElement(“div”); g.appendChild(d1); d1.appendChild(mkField(“Basic Plan GHC”,”<input id='sp1' type='number' placeholder='12'/>”));
var d2=document.createElement(“div”); g.appendChild(d2); d2.appendChild(mkField(“Premium Plan GHC”,”<input id='sp2' type='number' placeholder='16'/>”));
var d3=document.createElement(“div”); g.appendChild(d3); d3.appendChild(mkField(“Bundle Plan GHC”,”<input id='sp3' type='number' placeholder='28'/>”));
cb2.appendChild(mkBtn(“Save Prices”,“btn btn-p”,function(){
Promise.all([dbSet(“price_basic”,gv(“sp1”)),dbSet(“price_premium”,gv(“sp2”)),dbSet(“price_bundle”,gv(“sp3”))]).then(function(){toast(“Saved”,“ok”);}).catch(function(){toast(“Error”,“err”);});
}));
dbGet(“settings”,“key=in.("pk_test_pub","pk_live_pub","pk_live_mode","price_basic","price_premium","price_bundle")&select=key,value”).then(function(d){
var v={}; (d||[]).forEach(function(s){v[s.key]=s.value;});
if(v.pk_test_pub&&ge(“pk1”))ge(“pk1”).value=v.pk_test_pub;
if(v.pk_live_pub&&ge(“pk3”))ge(“pk3”).value=v.pk_live_pub;
if(v.price_basic&&ge(“sp1”))ge(“sp1”).value=v.price_basic;
if(v.price_premium&&ge(“sp2”))ge(“sp2”).value=v.price_premium;
if(v.price_bundle&&ge(“sp3”))ge(“sp3”).value=v.price_bundle;
var live=v.pk_live_mode===“true”;
var tog=ge(“pktog”); if(tog&&live)tog.classList.add(“on”);
var md=ge(“pkmode”); if(md){md.textContent=live?“Live Mode”:“Test Mode”;md.style.color=live?”#6ee7b7”:”#fcd34d”;}
}).catch(function(){});
}

buildTabs();
showPage(“dash”);
</script>
