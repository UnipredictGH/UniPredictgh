<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniPredict Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#0f0f1a;color:#e2e8f0;margin:0;font-size:14px}
#top{background:#161625;padding:12px 18px;border-bottom:2px solid #7C3AED;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
#top h1{font-size:16px;color:#a78bfa;margin:0}
#top a{color:#a78bfa;font-size:12px;text-decoration:none;border:1px solid rgba(124,58,237,.3);padding:5px 10px;border-radius:6px}
#tabs{background:#161625;display:flex;overflow-x:auto;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.08);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 13px;font-size:12px;font-weight:600;color:#64748b;border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-family:Arial,sans-serif}
.tab.on{color:#a78bfa;border-bottom-color:#7C3AED}
#main{padding:16px;max-width:980px;margin:0 auto;padding-bottom:80px}
.card{background:#161625;border:1px solid rgba(255,255,255,.07);border-radius:10px;margin-bottom:14px;overflow:hidden}
.card-head{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-head h3{font-size:14px;font-weight:800;color:#f1f5f9;margin:0}
.card-body{padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:500px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{background:#1e1e32;border-radius:10px;padding:14px 10px;text-align:center}
.stat-n{font-size:26px;font-weight:900;color:#f1f5f9}
.stat-l{font-size:10px;color:#64748b;margin-top:3px;font-weight:600;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:700;border:none;font-family:Arial,sans-serif;cursor:pointer;white-space:nowrap}
.btn:active{opacity:.8}
.btn-p{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff}
.btn-s{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.btn-r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.btn-g{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.btn-o{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.3)}
.btn-gh{background:transparent;color:#64748b;border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:4px 9px;font-size:11px}
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none;box-sizing:border-box}
.field textarea{resize:vertical;min-height:68px}
.field input[type=color]{padding:3px;height:38px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.bdg{display:inline-flex;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700}
.bp{background:rgba(124,58,237,.2);color:#a78bfa}
.bg{background:rgba(16,185,129,.15);color:#6ee7b7}
.br{background:rgba(239,68,68,.15);color:#fca5a5}
.bo{background:rgba(245,158,11,.15);color:#fcd34d}
.bb{background:rgba(59,130,246,.15);color:#93c5fd}
.by{background:rgba(255,255,255,.07);color:#94a3b8}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#ov.open{display:flex}
#md{background:#161625;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;position:relative}
#md h3{font-size:15px;font-weight:800;color:#f1f5f9;margin:0 0 14px 0}
#mcl{position:absolute;top:12px;right:14px;background:none;border:none;color:#475569;font-size:22px;cursor:pointer;padding:4px;line-height:1}
.tog{width:44px;height:24px;background:#334155;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background .2s;display:inline-block;vertical-align:middle}
.tog.on{background:#7C3AED}
.tog-d{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;pointer-events:none}
.tog.on .tog-d{left:23px}
#toasts{position:fixed;bottom:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#1e1e32;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;font-size:12px;color:#f1f5f9;min-width:180px}
.lrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:10px}
.lrow:last-child{border-bottom:none}
.lrow h4{font-size:13px;font-weight:600;color:#f1f5f9;margin:0}
.lrow p{font-size:11px;color:#475569;margin:2px 0 0 0}
.empty{text-align:center;padding:36px;color:#475569}
.sb{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ph{font-size:16px;font-weight:800;color:#f1f5f9;margin:0}
.muted{color:#64748b;font-size:12px}
.pager{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid rgba(255,255,255,.06)}
.pbtn{padding:4px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.07);background:#1e1e32;color:#94a3b8;font-size:11px;cursor:pointer;font-family:Arial,sans-serif}
.pbtn.on{background:#7C3AED;color:#fff;border-color:#7C3AED}
</style>
</head>

</div>
<script>
var SB="https://urfqevstrwsrtysbllah.supabase.co";
var SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjIwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";
var CUR="dash";

function hd(){return{“apikey”:SK,“Authorization”:“Bearer “+SK,“Content-Type”:“application/json”,“Prefer”:“return=representation”};}
function dbG(t,q){return fetch(SB+”/rest/v1/”+t+”?”+(q||””)+”&limit=5000”,{headers:hd()}).then(function(r){return r.ok?r.json():r.text().then(function(x){throw new Error(x);});});}
function dbP(t,b){return fetch(SB+”/rest/v1/”+t,{method:“POST”,headers:hd(),body:JSON.stringify(b)}).then(function(r){return r.ok?r.json():r.text().then(function(x){throw new Error(x);});});}
function dbU(t,id,b){return fetch(SB+”/rest/v1/”+t+”?id=eq.”+id,{method:“PATCH”,headers:hd(),body:JSON.stringify(b)}).then(function(r){return r.ok?r.json():r.text().then(function(x){throw new Error(x);});});}

function toast(msg){var e=document.createElement(“div”);e.className=“toast”;e.textContent=msg;document.getElementById(“toasts”).appendChild(e);setTimeout(function(){e.remove();},3000);}
function openMd(fn){document.getElementById(“mbd”).innerHTML=””;fn(document.getElementById(“mbd”));document.getElementById(“ov”).className=“open”;}

document.getElementById(“mcl”).onclick=closeMd;
document.getElementById(“ov”).onclick=function(e){if(e.target===this)closeMd();};

function gv(id){var e=document.getElementById(id);return e?e.value.trim():””;}

b.className=“btn “+cls;
b.textContent=txt;

}
function fld(lbl,html){
var d=document.createElement(“div”);
d.className=“field”;
d.innerHTML=”<label>”+lbl+”</label>”+html;

}
function brow(){
var d=document.createElement(“div”);
d.style.cssText=“display:flex;gap:8px;margin-top:14px;flex-wrap:wrap”;
for(var i=0;i<arguments.length;i++)d.appendChild(arguments[i]);
return d;
}
function sp(){return document.createTextNode(” “);}

var TABS=[
{id:“dash”,label:“Dashboard”},
{id:“unis”,label:“Universities”},
{id:“progs”,label:“Programmes”},
{id:“ai”,label:“AI Inbox”},
{id:“schols”,label:“Scholarships”},
{id:“news”,label:“News”},
{id:“forms”,label:“Forms”},
{id:“anns”,label:“Announcements”},
{id:“pays”,label:“Payments”},
{id:“users”,label:“Users”},
{id:“appear”,label:“Appearance”},
{id:“stext”,label:“Site Text”},
{id:“feats”,label:“Toggles”},
{id:“pstack”,label:“Paystack”}
];

function buildTabs(){
var c=document.getElementById(“tabs”);
c.innerHTML=””;
for(var i=0;i<TABS.length;i++){
var t=TABS[i];
var b=document.createElement(“button”);
b.className=“tab”+(CUR===t.id?” on”:””);
b.textContent=t.label;
b.setAttribute(“data-id”,t.id);
b.onclick=function(){CUR=this.getAttribute(“data-id”);buildTabs();showPage(CUR);};
c.appendChild(b);
}
}

function showPage(id){
var m=document.getElementById(“main”);
m.innerHTML=””;
if(id===“dash”)pgDash(m);
else if(id===“unis”)pgUnis(m);
else if(id===“progs”)pgProgs(m);
else if(id===“ai”)pgAI(m);
else if(id===“schols”)pgSchols(m);
else if(id===“news”)pgNews(m);
else if(id===“forms”)pgForms(m);
else if(id===“anns”)pgAnns(m);
else if(id===“pays”)pgPays(m);
else if(id===“users”)pgUsers(m);
else if(id===“appear”)pgAppear(m);
else if(id===“stext”)pgStext(m);
else if(id===“feats”)pgFeats(m);
else if(id===“pstack”)pgPstack(m);
}

function pgDash(m){
var g=document.createElement(“div”);g.className=“stats”;m.appendChild(g);
var st=[{id:“s1”,l:“Universities”},{id:“s2”,l:“Programmes”},{id:“s3”,l:“Users”},{id:“s4”,l:“Revenue GHC”},{id:“s5”,l:“Pending Pays”},{id:“s6”,l:“AI Questions”}];
for(var i=0;i<st.length;i++){var b=document.createElement(“div”);b.className=“stat”;g.appendChild(b);var n=document.createElement(“div”);n.className=“stat-n”;n.id=st[i].id;n.textContent=”…”;b.appendChild(n);var l=document.createElement(“div”);l.className=“stat-l”;l.textContent=st[i].l;b.appendChild(l);}
var card=document.createElement(“div”);card.className=“card”;m.appendChild(card);
var ch=document.createElement(“div”);ch.className=“card-head”;card.appendChild(ch);
var h=document.createElement(“h3”);h.textContent=“Quick Actions”;ch.appendChild(h);
var cb=document.createElement(“div”);cb.className=“card-body”;cb.style.cssText=“display:flex;gap:6px;flex-wrap:wrap”;card.appendChild(cb);
var qs=[[“Universities”,“unis”],[“Programmes”,“progs”],[“AI Inbox”,“ai”],[“Payments”,“pays”],[“Users”,“users”],[“Announcements”,“anns”],[“Appearance”,“appear”],[“Toggles”,“feats”],[“Edit Text”,“stext”],[“Paystack”,“pstack”]];
for(var j=0;j<qs.length;j++){
cb.appendChild(btn(qs[j][0],“btn-s”,function(id){return function(){CUR=id;buildTabs();showPage(id);};}(qs[j][1])));
}
dbG(“universities”,“active=eq.true&select=id”).then(function(d){var e=ge(“s1”);if(e)e.textContent=d.length;}).catch(function(){});
dbG(“programmes”,“active=eq.true&select=id”).then(function(d){var e=ge(“s2”);if(e)e.textContent=d.length;}).catch(function(){});
dbG(“profiles”,“select=id”).then(function(d){var e=ge(“s3”);if(e)e.textContent=d.length;}).catch(function(){});
dbG(“payments”,“status=eq.success&select=amount”).then(function(d){var e=ge(“s4”);if(e)e.textContent=Math.round(d.reduce(function(s,x){return s+(x.amount||0);},0)/100);}).catch(function(){});
dbG(“payments”,“status=eq.pending&select=id”).then(function(d){var e=ge(“s5”);if(e)e.textContent=d.length;}).catch(function(){});
dbG(“ai_inbox”,“status=eq.pending&select=id”).then(function(d){var e=ge(“s6”);if(e)e.textContent=d.length;}).catch(function(){});
}

var _unis=[];
function pgUnis(m){
var sb=document.createElement(“div”);sb.className=“sb”;m.appendChild(sb);
var h=document.createElement(“h2”);h.className=“ph”;h.textContent=“Universities”;sb.appendChild(h);
sb.appendChild(btn(”+ Add”,“btn-p”,function(){uniMd(null);}));
var si=document.createElement(“input”);si.placeholder=“Search…”;si.style.cssText=“width:100%;padding:9px 12px;background:#1e1e32;border:1.5px solid rgba(255,255,255,.08);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:Arial,sans-serif;outline:none;margin-bottom:12px;box-sizing:border-box”;m.appendChild(si);
si.oninput=function(){renderUnis(si.value);};
var card=document.createElement(“div”);card.className=“card”;m.appendChild(card);
var tbl=document.createElement(“table”);tbl.className=“tbl”;card.appendChild(tbl);
var thead=document.createElement(“thead”);tbl.appendChild(thead);
var hr=document.createElement(“tr”);thead.appendChild(hr);
[“Code”,“Name”,“Type”,“Region”,“Progs”,“Status”,“Actions”].forEach(function(h){var th=document.createElement(“th”);th.textContent=h;hr.appendChild(th);});
var tb=document.createElement(“tbody”);tb.id=“utb”;tbl.appendChild(tb);
tb.innerHTML=”<tr><td colspan='7' class='empty'>Loading…</td></tr>”;
Promise.all([dbG(“universities”,“order=name.asc&select=*”),dbG(“programmes”,“select=university_id”)]).then(function(r){
_unis=r[0]||[];var pc={};
(r[1]||[]).forEach(function(p){pc[p.university_id]=(pc[p.university_id]||0)+1;});
_unis.forEach(function(u){u._pc=pc[u.id]||0;});
renderUnis(””);
}).catch(function(e){toast(“Error: “+e.message);});
}
function renderUnis(q){
var tb=ge(“utb”);if(!tb)return;
var data=q?_unis.filter(function(u){return(u.name+u.code+(u.region||””)).toLowerCase().indexOf(q.toLowerCase())>=0;}):_unis;
tb.innerHTML=””;
if(!data.length){tb.innerHTML=”<tr><td colspan='7' class='empty'>None found</td></tr>”;return;}
data.forEach(function(u){
var tr=document.createElement(“tr”);tb.appendChild(tr);
var c1=document.createElement(“td”);c1.appendChild(bx(u.code,“bdg bp”));tr.appendChild(c1);
var c2=document.createElement(“td”);c2.textContent=u.name;c2.style.cssText=“font-weight:600;color:#f1f5f9”;tr.appendChild(c2);
var c3=document.createElement(“td”);c3.appendChild(bx(u.type||”–”,u.type===“Public”?“bdg bg”:“bdg bo”));tr.appendChild(c3);
var c4=document.createElement(“td”);c4.textContent=u.region||”–”;c4.className=“muted”;tr.appendChild(c4);
var c5=document.createElement(“td”);c5.textContent=u._pc;c5.className=“muted”;tr.appendChild(c5);
var c6=document.createElement(“td”);c6.appendChild(bx(u.active?“Active”:“Hidden”,u.active?“bdg bg”:“bdg br”));tr.appendChild(c6);
var c7=document.createElement(“td”);c7.style.whiteSpace=“nowrap”;tr.appendChild(c7);
c7.appendChild(btn(“Edit”,“btn-gh btn-sm”,function(uid){return function(){var u=_unis.find(function(x){return x.id===uid;});if(u)uniMd(u);};}(u.id)));
c7.appendChild(sp());
c7.appendChild(btn(u.active?“Hide”:“Show”,“btn-sm “+(u.active?“btn-o”:“btn-g”),function(uid,act){return function(){dbU(“universities”,uid,{active:!act}).then(function(){toast(“Done”);CUR=“unis”;buildTabs();showPage(“unis”);}).catch(function(e){toast(e.message);});};}(u.id,u.active)));
c7.appendChild(sp());
c7.appendChild(btn(“Del”,“btn-r btn-sm”,function(uid){return function(){if(!confirm(“Delete?”))return;dbD(“universities”,uid).then(function(){toast(“Deleted”);CUR=“unis”;buildTabs();showPage(“unis”);}).catch(function(e){toast(e.message);});};}(u.id)));
});
}
function uniMd(u){
openMd(function(body){
var h=document.createElement(“h3”);h.textContent=(u?“Edit”:“Add”)+” University”;body.appendChild(h);
var REGS=[“Greater Accra”,“Ashanti”,“Central”,“Eastern”,“Western”,“Northern”,“Upper East”,“Upper West”,“Volta”,“Bono”,“North East”,“Western North”];
var TYPES=[“Public”,“Private”,“Technical”,“Distance”];
body.appendChild(fld(“Code *”,”<input id='uf1' value='"+(u?u.code:"")+"'/>”));
body.appendChild(fld(“Full Name *”,”<input id='uf2' value='"+(u?u.name:"")+"'/>”));

var g=document.createElement(“div”);g.className=“g2”;body.appendChild(g);
var d1=document.createElement(“div”);g.appendChild(d1);d1.appendChild(fld(“Type”,”<select id='uf4'>”+TYPES.map(function(t){return”<option”+(u&&u.type===t?” selected”:””)+”>”+t+”</option>”;}).join(””)+”</select>”));
var d2=document.createElement(“div”);g.appendChild(d2);d2.appendChild(fld(“Founded”,”<input id='uf5' type='number' value='"+(u?u.founded||"":"")+"'/>”));
var d3=document.createElement(“div”);g.appendChild(d3);d3.appendChild(fld(“City”,”<input id='uf6' value='"+(u?u.location||"":"")+"'/>”));
var d4=document.createElement(“div”);g.appendChild(d4);d4.appendChild(fld(“Region”,”<select id='uf7'>”+REGS.map(function(r){return”<option”+(u&&u.region===r?” selected”:””)+”>”+r+”</option>”;}).join(””)+”</select>”));
body.appendChild(fld(“Website”,”<input id='uf8' value='"+(u?u.website||"":"")+"'/>”));
body.appendChild(fld(“About”,”<textarea id='uf9'>”+(u?u.about||””:””)+”</textarea>”));
body.appendChild(brow(
btn(u?“Save”:“Add University”,“btn-p”,function(){
var code=gv(“uf1”).toUpperCase(),name=gv(“uf2”);
if(!code||!name){toast(“Code and name required”);return;}
var b={code:code,name:name,short_name:gv(“uf3”)||code,type:sv(“uf4”),location:gv(“uf6”),region:sv(“uf7”),founded:parseInt(gv(“uf5”))||null,website:gv(“uf8”),about:gv(“uf9”),active:true,updated_at:new Date().toISOString()};
(u?dbU(“universities”,u.id,b):dbP(“universities”,b)).then(function(){toast(“Saved”);closeMd();CUR=“unis”;buildTabs();showPage(“unis”);}).catch(function(e){toast(e.message);});

btn(“Cancel”,“btn-gh”,closeMd)
));
});
}

var _progs=[],_pu=[],_fp=[],_pg=0,_pp=50;
function pgProgs(m){
var sb=document.createElement(“div”);sb.className=“sb”;m.appendChild(sb);
var h=document.createElement(“h2”);h.className=“ph”;h.textContent=“Programmes”;sb.appendChild(h);
sb.appendChild(btn(”+ Add”,“btn-p”,function(){progMd(null);}));
